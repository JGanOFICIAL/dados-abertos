<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carregamento · Estúdio Karyna Santos</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}.loading{height:100%;display:grid;place-items:center;color:#806675;font-size:13px}.spinner{width:25px;height:25px;border:3px solid #f2dfe7;border-top-color:#b97893;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="loading"><div><div class="spinner"></div>Preparando atendimento...</div></div>
<script src="env.js"></script>
<script src="auth.pass.js"></script>
<script>
(function(){
 const status=document.querySelector(".loading");
 function announce(){
   if(window.estudioService){
     window.service=window.estudioService;
     if(status)status.textContent="Serviço pronto.";
     try{if(parent!==window)parent.postMessage({type:"ESTUDIO_SERVICE_READY"},location.origin)}catch(e){}
   }else if(window.estudioServiceError){
     if(status)status.textContent="Não foi possível iniciar o serviço. Atualize a página.";
   }
 }
 window.addEventListener("estudio-service-ready",announce,{once:true});
 if(window.estudioService||window.estudioServiceError)announce();
})();
</script>
</body></html>
