<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Imovel - Josenildo Menezes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --azul-escuro: #0a1628;
            --azul-medio: #1a2744;
            --dourado: #c9a96e;
            --branco: #ffffff;
            --cinza-claro: #f8f9fb;
            --cinza-medio: #e8ecf1;
            --cinza-escuro: #5a6678;
            --gradiente-azul: linear-gradient(135deg, #0a1628 0%, #1a2744 50%, #2a3f6e 100%);
            --gradiente-dourado: linear-gradient(135deg, #c9a96e 0%, #b8960f 100%);
            --sombra-suave: 0 4px 20px rgba(0, 0, 0, 0.06);
            --sombra-media: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        body {
            background: var(--cinza-claro);
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* LOCAL PARA COLAR A URL DA IMAGEM DE FUNDO */
        /* Substitua a URL abaixo pela sua imagem de fundo */
        .header-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            /* background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMGIq8X8W64trsExxd6QmWlC3KoaIpPL9AeOx9lYRlEw&s=10'); */
            /* background-size: cover; */
            /* background-position: center; */
        }

        .header {
            background: var(--gradiente-azul);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 30px rgba(10, 22, 40, 0.3);
        }

        .header-title {
            color: var(--branco);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--branco);
            padding: 10px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-2px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
            width: 100%;
        }

        .image-carousel {
            position: relative;
            background: var(--branco);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--sombra-media);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-slide {
            min-width: 100%;
            position: relative;
            cursor: pointer;
        }

        .carousel-slide img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        .carousel-dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: white;
            width: 24px;
            border-radius: 5px;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 22, 40, 0.6);
            color: var(--branco);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .carousel-btn:hover {
            background: rgba(10, 22, 40, 0.9);
            width: 52px;
            height: 52px;
        }

        .carousel-btn.prev { left: 16px; }
        .carousel-btn.next { right: 16px; }

        .image-expanded {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .image-expanded.active {
            display: flex;
        }

        .image-expanded img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .details-section {
            background: var(--branco);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--sombra-suave);
        }

        .property-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--azul-escuro);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .property-price {
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradiente-azul);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--cinza-medio);
        }

        .property-description {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--cinza-claro);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: #eef0f5;
        }

        .info-item-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--azul-escuro);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-item-icon svg {
            width: 20px;
            height: 20px;
            color: var(--dourado);
        }

        .info-item-content strong {
            display: block;
            font-size: 0.85rem;
            color: var(--cinza-escuro);
            margin-bottom: 2px;
        }

        .info-item-content span {
            font-weight: 600;
            color: #1a1a1a;
        }

        .whatsapp-btn {
            width: 100%;
            padding: 18px;
            background: #25D366;
            color: var(--branco);
            border: none;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 32px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(37, 211, 102, 0.4);
        }

        .related-section {
            margin-top: 8px;
        }

        .related-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--azul-escuro);
        }

        .related-carousel {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--cinza-medio) transparent;
        }

        .related-carousel::-webkit-scrollbar {
            height: 6px;
        }

        .related-carousel::-webkit-scrollbar-track {
            background: transparent;
        }

        .related-carousel::-webkit-scrollbar-thumb {
            background: var(--cinza-medio);
            border-radius: 3px;
        }

        .related-card {
            min-width: 260px;
            background: var(--branco);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--sombra-suave);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            border: 1px solid transparent;
        }

        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--sombra-media);
            border-color: var(--cinza-medio);
        }

        .related-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .related-card-content {
            padding: 14px;
        }

        .related-card h4 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        .related-card .price {
            font-weight: 700;
            color: var(--azul-escuro);
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--cinza-medio);
            border-top: 3px solid var(--azul-escuro);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 16px;
            color: var(--cinza-escuro);
            font-weight: 500;
        }

        .footer {
            background: var(--gradiente-azul);
            color: var(--branco);
            padding: 24px 32px;
            text-align: center;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer p {
            margin-bottom: 4px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .footer-credits {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .property-title { font-size: 1.4rem; }
            .property-price { font-size: 1.4rem; }
            .carousel-slide img { height: 300px; }
            .header-title { font-size: 1.2rem; }
            .header { padding: 14px 20px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 
    ============================================
    LOCAL PARA COLAR A URL DA IMAGEM DE FUNDO
    ============================================
    Para adicionar uma imagem de fundo no cabecalho, 
    substitua o background do .header-wrapper abaixo.
    Exemplo: background-image: url('https://exemplo.com/imagem.jpg');
    -->
    <div class="header-wrapper" style="/* background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMGIq8X8W64trsExxd6QmWlC3KoaIpPL9AeOx9lYRlEw&s=10'); background-size: cover; background-position: center; */">
        <header class="header">
            <h1 class="header-title">Josenildo Menezes</h1>
            <button class="back-btn" onclick="history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Voltar
            </button>
        </header>
    </div>

    <div class="container">
        <div class="image-carousel" id="imageCarousel">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide">
                    <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800" alt="Carregando...">
                </div>
            </div>
            <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
            <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
            <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <div class="image-expanded" id="imageExpanded" onclick="closeExpanded()">
            <img id="expandedImage" src="" alt="Imagem ampliada">
        </div>

        <div class="details-section">
            <h1 class="property-title" id="propertyTitle">Carregando...</h1>
            <div class="property-price" id="propertyPrice"></div>
            <p class="property-description" id="propertyDescription"></p>
            <div class="info-grid" id="infoGrid"></div>
        </div>

        <button class="whatsapp-btn" onclick="openWhatsApp()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/>
            </svg>
            Chamar no WhatsApp
        </button>

        <div class="related-section">
            <h2>Voce tambem pode gostar</h2>
            <div class="related-carousel" id="relatedCarousel">
                <p style="color:#5a6678;">Carregando publicacoes relacionadas...</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p><strong>Josenildo Menezes</strong> - Corretor de Imoveis</p>
            <p>WhatsApp: (84) 99910-4221</p>
            <p class="footer-credits">&copy; 2024 Todos os direitos reservados. Desenvolvido por San7 Brasil.</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",
            databaseURL: "https://san7-brasil-default-rtdb.firebaseio.com",
            projectId: "san7-brasil",
            authDomain: "san7-brasil.firebaseapp.com"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const publicationId = urlParams.get('id');

        let currentSlide = 0;
        let allPublications = [];
        let currentPublication = null;

        async function loadPublication() {
            if (!publicationId) {
                document.getElementById('propertyTitle').textContent = 'Publicacao nao encontrada';
                return;
            }

            const publicationsRef = ref(database, 'publications');
            
            onValue(publicationsRef, (snapshot) => {
                const data = snapshot.val();
                allPublications = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        const pub = { id: key, ...data[key] };
                        allPublications.push(pub);
                        if (key === publicationId) {
                            currentPublication = pub;
                        }
                    });
                }
                
                if (currentPublication) {
                    renderPublication(currentPublication);
                    renderRelated();
                } else {
                    document.getElementById('propertyTitle').textContent = 'Publicacao nao encontrada';
                }
            });
        }

        function renderPublication(pub) {
            document.getElementById('propertyTitle').textContent = pub.title || 'Imovel sem titulo';
            document.getElementById('propertyPrice').textContent = pub.price || 'Sob consulta';
            document.getElementById('propertyDescription').textContent = pub.description || 'Nenhuma descricao disponivel para este imovel.';

            const track = document.getElementById('carouselTrack');
            const dots = document.getElementById('carouselDots');
            
            if (pub.images && pub.images.length > 0) {
                track.innerHTML = pub.images.map((img, i) => `
                    <div class="carousel-slide" onclick="openExpanded('${img}')">
                        <img src="${img}" alt="Imagem ${i + 1} do imovel" loading="lazy">
                    </div>
                `).join('');
                
                dots.innerHTML = pub.images.map((_, i) => `
                    <div class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>
                `).join('');
            } else {
                track.innerHTML = `
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800" alt="Imagem padrao">
                    </div>
                `;
                dots.innerHTML = '<div class="carousel-dot active"></div>';
            }
            
            currentSlide = 0;
            updateCarousel();

            const infoGrid = document.getElementById('infoGrid');
            let infoHTML = '';
            
            if (pub.location) {
                infoHTML += `
                    <div class="info-item">
                        <div class="info-item-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        <div class="info-item-content">
                            <strong>Localizacao</strong>
                            <span>${pub.location}</span>
                        </div>
                    </div>
                `;
            }

            if (pub.category) {
                infoHTML += `
                    <div class="info-item">
                        <div class="info-item-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                            </svg>
                        </div>
                        <div class="info-item-content">
                            <strong>Categoria</strong>
                            <span>${pub.category.replace(/-/g, ' - ')}</span>
                        </div>
                    </div>
                `;
            }

            if (pub.additionalInfo) {
                Object.keys(pub.additionalInfo).forEach(key => {
                    infoHTML += `
                        <div class="info-item">
                            <div class="info-item-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="8" x2="12" y2="12"/>
                                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                            </div>
                            <div class="info-item-content">
                                <strong>${key}</strong>
                                <span>${pub.additionalInfo[key]}</span>
                            </div>
                        </div>
                    `;
                });
            }

            infoGrid.innerHTML = infoHTML || '<p style="color:#5a6678;">Nenhuma informacao adicional disponivel</p>';
        }

        function renderRelated() {
            const relatedCarousel = document.getElementById('relatedCarousel');
            const otherPubs = allPublications.filter(p => p.id !== publicationId);
            const shuffled = otherPubs.sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 5);

            if (selected.length === 0) {
                relatedCarousel.innerHTML = '<p style="color:#5a6678;">Nenhuma publicacao relacionada no momento</p>';
                return;
            }

            relatedCarousel.innerHTML = selected.map(pub => `
                <div class="related-card" onclick="window.location.href='artigo.html?id=${pub.id}'">
                    <img src="${pub.images && pub.images[0] ? pub.images[0] : 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=400'}" alt="${pub.title || 'Imovel'}" loading="lazy">
                    <div class="related-card-content">
                        <h4>${pub.title || 'Imovel sem titulo'}</h4>
                        <p class="price">${pub.price || 'Sob consulta'}</p>
                    </div>
                </div>
            `).join('');
        }

        window.moveSlide = function(direction) {
            const slides = document.querySelectorAll('.carousel-slide');
            if (slides.length === 0) return;
            
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = slides.length - 1;
            if (currentSlide >= slides.length) currentSlide = 0;
            
            updateCarousel();
        };

        window.goToSlide = function(index) {
            currentSlide = index;
            updateCarousel();
        };

        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            const dots = document.querySelectorAll('.carousel-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        }

        window.openExpanded = function(imageSrc) {
            document.getElementById('expandedImage').src = imageSrc;
            document.getElementById('imageExpanded').classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeExpanded = function() {
            document.getElementById('imageExpanded').classList.remove('active');
            document.body.style.overflow = '';
        };

        window.openWhatsApp = function() {
            const message = currentPublication ? 
                `Ola! Gostaria de saber mais sobre: ${currentPublication.title}` : 
                'Ola! Gostaria de saber mais sobre este imovel';
            window.open(`https://wa.me/5584999104221?text=${encodeURIComponent(message)}`, '_blank');
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeExpanded();
            if (e.key === 'ArrowLeft') moveSlide(-1);
            if (e.key === 'ArrowRight') moveSlide(1);
        });

        loadPublication();
    </script>
</body>
</html>
