<style>
#ev-overlay{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:100%!important;z-index:2147483647!important;display:flex!important;align-items:center!important;justify-content:center!important;background:rgba(0,0,0,.55)!important;-webkit-backdrop-filter:blur(10px)!important;backdrop-filter:blur(10px)!important;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s ease;font-family:Arial,Helvetica,sans-serif!important;padding:20px!important;box-sizing:border-box!important;margin:0!important}
#ev-overlay.ev-show{opacity:1!important;visibility:visible!important}
#ev-overlay.ev-hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#ev-box{background:#fff!important;border:2px solid #fff!important;border-radius:0!important;max-width:440px!important;width:100%!important;padding:44px 32px!important;text-align:center!important;box-sizing:border-box!important;box-shadow:0 20px 60px rgba(0,0,0,.45)!important;margin:0!important}
#ev-box h2{margin:0 0 14px!important;padding:0!important;color:#000!important;font-size:26px!important;line-height:1.25!important;font-weight:700!important;font-family:Arial,Helvetica,sans-serif!important}
#ev-box p{margin:0 0 30px!important;padding:0!important;color:#333!important;font-size:15px!important;line-height:1.55!important;font-family:Arial,Helvetica,sans-serif!important}
#ev-btn{display:inline-block!important;background:#FFD400!important;color:#000!important;border:2px solid #FFD400!important;border-radius:0!important;padding:14px 52px!important;margin:0!important;font-size:15px!important;font-weight:700!important;letter-spacing:.5px!important;text-transform:uppercase!important;cursor:pointer!important;font-family:Arial,Helvetica,sans-serif!important;line-height:1.2!important;-webkit-appearance:none!important;appearance:none!important;box-shadow:none!important;width:auto!important;height:auto!important}
#ev-btn:hover{background:#FFC400!important;border-color:#FFC400!important}
#ev-player{position:fixed!important;bottom:0!important;right:0!important;width:100px!important;height:56px!important;opacity:0.01!important;pointer-events:none!important;z-index:1!important;overflow:hidden!important;margin:0!important;padding:0!important;background:transparent!important;border:0!important}
#ev-player iframe{width:100px!important;height:56px!important;border:0!important;display:block!important;pointer-events:none!important;max-width:none!important}
</style>

<script>
(function(){
var VIDEO_URL="https://youtu.be/zh3Fd6cCPNg?is=y_u4zX4tUAqywcVB";
var DELAY=2000;

function getId(u){
var m=u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
return m?m[1]:u;
}

function start(){
if(document.getElementById("ev-overlay"))return;
var vid=getId(VIDEO_URL);
var player=null,ready=false,wantPlay=false;

var overlay=document.createElement("div");
overlay.id="ev-overlay";
overlay.innerHTML='<div id="ev-box"><h2>Olá, bem-vindo ao evento</h2><p>Clique em acessar para se inscrever no evento ou consultar a sua inscrição.</p><button id="ev-btn" type="button">Acessar</button></div>';
document.body.appendChild(overlay);

var holder=document.createElement("div");
holder.id="ev-player";
holder.innerHTML='<div id="ev-yt"></div>';
document.body.appendChild(holder);

function initPlayer(){
player=new YT.Player("ev-yt",{
width:"100",height:"56",videoId:vid,
playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,cc_load_policy:0,showinfo:0,loop:1,playlist:vid,enablejsapi:1,origin:window.location.origin},
events:{
onReady:function(){ready=true;if(wantPlay){player.unMute();player.setVolume(100);player.playVideo();}},
onStateChange:function(e){if(e.data===YT.PlayerState.ENDED){player.playVideo();}}
}
});
}

if(window.YT&&window.YT.Player){initPlayer();}
else{
var prev=window.onYouTubeIframeAPIReady;
window.onYouTubeIframeAPIReady=function(){if(typeof prev==="function"){try{prev();}catch(e){}}initPlayer();};
if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){
var s=document.createElement("script");
s.src="https://www.youtube.com/iframe_api";
document.head.appendChild(s);
}
}

var prevOverflow="";
setTimeout(function(){
prevOverflow=document.body.style.overflow;
document.body.style.overflow="hidden";
overlay.classList.add("ev-show");
},DELAY);

document.getElementById("ev-btn").addEventListener("click",function(){
wantPlay=true;
if(ready&&player){player.unMute();player.setVolume(100);player.playVideo();}
overlay.classList.remove("ev-show");
overlay.classList.add("ev-hide");
document.body.style.overflow=prevOverflow;
setTimeout(function(){overlay.style.display="none";},800);
});
}

if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",start);}
else{start();}
})();
</script>
