<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5c400"><title>Academia União Fitness</title><link rel="stylesheet" href="style.css"></head><body data-page="home"><header id="siteHeader" class="site-header"><a class="brand" href="index.html"><img id="headerLogo" alt="União Fitness"><span id="brandName">Academia União Fitness</span></a><button class="menu-toggle" id="menuToggle" aria-label="Abrir menu"><i></i><i></i><i></i></button><nav id="siteMenu" class="site-menu"><button data-view="home">Início</button><button data-view="register">Inscreva-se</button><button data-view="lookup">Consultar inscrição</button></nav></header><div id="notice" class="notice" role="status"></div><main id="mainContent"><section id="homeView"><div id="welcomeCarousel" class="welcome-carousel"></div><section class="intro"><p class="eyebrow">ACADEMIA UNIÃO FITNESS</p><h1 id="eventTitle">Inscrições abertas</h1><p id="eventDescription">Faça sua inscrição e acompanhe o status pelo CPF.</p><div class="actions"><button class="btn btn-primary" data-view="register">Inscreva-se</button><button class="btn btn-outline" data-view="lookup">Consultar inscrição</button></div></section><section id="homeSections" class="home-sections"></section><section id="sponsorsSection" class="sponsors"><h2>Parceiros</h2><div id="sponsorList" class="sponsor-list"></div></section></section><section id="registerView" class="view hidden"><div class="view-heading"><p class="eyebrow">UNIÃO FITNESS</p><h1>Ficha de inscrição</h1><p>Confira seus dados antes de confirmar.</p></div><form id="registrationForm" class="form-panel"><div id="registrationFields" class="field-grid"></div><label class="terms-check"><input id="termsAccepted" type="checkbox" required><span>Li e aceito os <button type="button" class="text-button" id="showTerms">termos de uso</button> e confirmo que as informações são verdadeiras.</span></label><p id="formErr <div id="aguarde-overlay"><div class="aguarde-conteudo"><span class="aguarde-spinner"></span><span class="aguarde-texto">Aguarde</span></div></div><style>#aguarde-overlay{position:fixed;inset:0;z-index:999999;background:rgba(15,23,42,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}#aguarde-overlay.aguarde-sair{opacity:0;visibility:hidden;pointer-events:none}.aguarde-conteudo{display:flex;flex-direction:column;align-items:center;gap:14px;background:rgba(255,255,255,.94);padding:25px 35px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.13)}.aguarde-spinner{width:35px;height:35px;border:3px solid #e5e7eb;border-top-color:#facc15;border-right-color:#facc15;border-radius:50%;animation:aguarde-girar .75s linear infinite}.aguarde-texto{font-family:Arial,sans-serif;font-size:14px;font-weight:600;color:#172033;letter-spacing:.3px}@keyframes aguarde-girar{to{transform:rotate(360deg)}}</style><script>(function(){var o=document.getElementById('aguarde-overlay');if(!o)return;setTimeout(function(){o.classList.add('aguarde-sair');setTimeout(function(){if(o.parentNode)o.parentNode.removeChild(o)},600)},2000)})();</script>
