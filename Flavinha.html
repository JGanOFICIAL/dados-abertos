<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    padding: 1rem;
  }

  .admin-container {
    max-width: 100%;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    align-items: center;
  }

  .btn-tool {
    padding: 0.55rem 1.3rem;
    border-radius: 30px;
    border: none;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: #2a2a2a;
    color: #ddd;
    transition: 0.25s;
    letter-spacing: 0.3px;
    backdrop-filter: blur(10px);
  }

  .btn-tool.orange {
    background: linear-gradient(135deg, #ff6b00, #e55d00);
    color: white;
    box-shadow: 0 8px 20px rgba(255,107,0,0.3);
  }

  .btn-tool.white {
    background: white;
    color: #0a0a0a;
  }

  .btn-tool:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .lista-cadastros {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .card-admin {
    background: rgba(20, 20, 20, 0.9);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    cursor: pointer;
    border: 1px solid #333;
    flex: 1 1 190px;
    transition: 0.25s;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  .card-admin:hover {
    border-color: #ff6b00;
    background: #1a1a1a;
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(255,107,0,0.2);
  }

  .card-admin img {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid #555;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    backdrop-filter: blur(5px);
  }

  .modal {
    background: #121212;
    border-radius: 32px;
    padding: 2rem;
    width: 94%;
    max-width: 500px;
    border: 1px solid #333;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
  }

  .btn-fechar {
    float: right;
    background: none;
    border: none;
    color: #ff4444;
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
    transition: 0.2s;
  }

  .btn-fechar:hover {
    color: #ff6666;
    transform: scale(1.1);
  }

  .input-dark {
    width: 100%;
    padding: 0.7rem 1.1rem;
    margin: 0.4rem 0;
    background: #1e1e1e;
    border: 1.5px solid #3a3a3a;
    border-radius: 18px;
    color: white;
    font-size: 0.85rem;
    outline: none;
    transition: 0.25s;
  }

  .input-dark:focus {
    border-color: #ff6b00;
    background: #252525;
  }

  .grid-botoes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .btn-small {
    padding: 0.5rem 1.1rem;
    border-radius: 22px;
    border: none;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    letter-spacing: 0.4px;
    transition: 0.2s;
  }

  .btn-small:hover {
    transform: translateY(-1px);
    filter: brightness(1.2);
  }

  .gold { background: linear-gradient(135deg, #ff6b00, #e55d00); color: white; }
  .red { background: #c0392b; color: white; }
  .blue { background: #1e3a5f; color: white; }
  .green { background: #0f4b2e; color: white; }
  .white-btn { background: #f0f0f0; color: #0a0a0a; }
  .purple { background: #4a1e5f; color: white; }
</style>

<div class="admin-container">
  <div class="toolbar">
    <button class="btn-tool white" id="btnRefresh">&#8635; Atualizar Lista</button>
    <button class="btn-tool orange" id="btnExportarCSV">&#128229; Exportar CSV</button>
    <button class="btn-tool" id="btnImprimir">&#128424; Imprimir Tela</button>
    <button class="btn-tool purple" id="btnExportarPDFCompleto">&#128196; PDF Completo</button>
  </div>
  <div class="lista-cadastros" id="listaRoot"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPiznHCVkTAgx6m02bZB8b0FFaot9UkBU",
    authDomain: "prefeitura-de-joao-camara.firebaseapp.com",
    projectId: "prefeitura-de-joao-camara",
    storageBucket: "prefeitura-de-joao-camara.firebasestorage.app",
    messagingSenderId: "269299041577",
    appId: "1:269299041577:web:fd41b2939240e9eb476338",
    measurementId: "G-YT7NHR342J"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const listaRoot = document.getElementById('listaRoot');
  let todosDados = {};

  function carregarLista() {
    onValue(ref(db, 'cadastros'), (snap) => {
      todosDados = snap.val() || {};
      renderizarCards(todosDados);
    });
  }

  function renderizarCards(dados) {
    listaRoot.innerHTML = '';
    if (!dados || Object.keys(dados).length === 0) {
      listaRoot.innerHTML = '<p style="color:#888; padding:1rem;">Nenhum cadastro encontrado.</p>';
      return;
    }
    Object.entries(dados).forEach(([tel, d]) => {
      const card = document.createElement('div');
      card.className = 'card-admin';
      card.innerHTML = `<img src="${d.foto}" alt="foto"><div><strong>${d.nome}</strong><br><small>${d.pagamento === 'confirmado' ? '✅ Confirmado' : '⏳ Aguardando'} | ${d.dataNasc}</small></div>`;
      card.onclick = () => abrirModal(tel, d);
      listaRoot.appendChild(card);
    });
  }

  function abrirModal(tel, d) {
    const existente = document.querySelector('.modal-overlay');
    if (existente) existente.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <button class="btn-fechar">&times;</button>
        <div style="text-align:center; margin-bottom:1rem;">
          <img src="${d.foto}" style="width:75px;height:75px;border-radius:50%;object-fit:cover;border:3px solid #ff6b00; box-shadow: 0 0 25px rgba(255,107,0,0.5);">
        </div>
        <input class="input-dark" id="editNome" value="${d.nome}" placeholder="Nome completo">
        <input class="input-dark" id="editData" value="${d.dataNasc}" placeholder="Data nasc.">
        <input class="input-dark" id="editGenero" value="${d.genero}" placeholder="Genero">
        <input class="input-dark" id="editTel" value="${tel}" placeholder="Telefone">
        <input class="input-dark" id="editAnotacoes" value="${d.anotacoes || ''}" placeholder="Anotacoes internas">
        <p style="margin:0.6rem 0;">Status: <strong>${d.pagamento}</strong> | Valor pago: R$${d.valorPago || '0,00'}</p>
        <input class="input-dark" id="inputValorPago" placeholder="Valor pago (R$)">
        <div class="grid-botoes">
          <button class="btn-small gold" id="btnConfirmar">&#10003; Confirmar Pag.</button>
          <button class="btn-small blue" id="btnSalvar">&#128190; Salvar Edicao</button>
          <button class="btn-small green" id="btnPdfIndividual">&#128196; PDF</button>
          <button class="btn-small white-btn" id="btnImprimirIndividual">&#128424; Imprimir</button>
          <button class="btn-small red" id="btnExcluir">&#128465; Excluir</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelector('.btn-fechar').onclick = () => overlay.remove();
    overlay.querySelector('#btnConfirmar').onclick = async () => {
      const valor = overlay.querySelector('#inputValorPago').value;
      await update(ref(db, 'cadastros/' + tel), { pagamento: 'confirmado', valorPago: valor });
      overlay.remove();
    };
    overlay.querySelector('#btnSalvar').onclick = async () => {
      await update(ref(db, 'cadastros/' + tel), {
        nome: overlay.querySelector('#editNome').value,
        dataNasc: overlay.querySelector('#editData').value,
        genero: overlay.querySelector('#editGenero').value,
        anotacoes: overlay.querySelector('#editAnotacoes').value
      });
      overlay.remove();
    };
    overlay.querySelector('#btnExcluir').onclick = async () => {
      if (confirm('Excluir este cadastro permanentemente?')) {
        await remove(ref(db, 'cadastros/' + tel));
        overlay.remove();
      }
    };
    overlay.querySelector('#btnPdfIndividual').onclick = () => gerarPDFIndividual(d);
    overlay.querySelector('#btnImprimirIndividual').onclick = () => imprimirIndividual(d);
  }

  function gerarPDFIndividual(d) {
    const conteudo = `Nome: ${d.nome}\nData Nasc.: ${d.dataNasc}\nGenero: ${d.genero}\nTelefone: ${d.telefone}\nPagamento: ${d.pagamento}\nValor: R$${d.valorPago || '0,00'}\nAnotacoes: ${d.anotacoes || 'Nenhuma'}`;
    const blob = new Blob([conteudo], {type: 'application/pdf'});
    const url = URL.createObjectURL(blob);
    window.open(url);
  }

  function imprimirIndividual(d) {
    const w = window.open('','','width=500,height=500');
    w.document.write(`
      <html><head><title>${d.nome}</title></head><body style="font-family:sans-serif; padding:20px;">
        <h2>${d.nome}</h2>
        <p>Data: ${d.dataNasc} | Genero: ${d.genero}</p>
        <p>Telefone: ${d.telefone}</p>
        <p>Pagamento: ${d.pagamento} | Valor: R$${d.valorPago || '0,00'}</p>
        <p>Anotacoes: ${d.anotacoes || 'Nenhuma'}</p>
      </body></html>`);
    w.print();
  }

  document.getElementById('btnRefresh').addEventListener('click', () => carregarLista());
  document.getElementById('btnExportarCSV').addEventListener('click', () => {
    let csv = 'Nome,Telefone,Data Nasc.,Genero,Pagamento,Valor Pago,Anotacoes\n';
    Object.entries(todosDados).forEach(([tel, d]) => {
      csv += `"${d.nome}","${tel}","${d.dataNasc}","${d.genero}","${d.pagamento}","${d.valorPago || '0'}","${d.anotacoes || ''}"\n`;
    });
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cadastros_sao_joao_2026.csv';
    a.click();
  });
  document.getElementById('btnImprimir').addEventListener('click', () => window.print());
  document.getElementById('btnExportarPDFCompleto').addEventListener('click', () => {
    let conteudo = 'RELATORIO COMPLETO - SAO JOAO 2026\n\n';
    Object.values(todosDados).forEach(d => {
      conteudo += `Nome: ${d.nome} | Tel: ${d.telefone} | Data: ${d.dataNasc} | Genero: ${d.genero} | Pag: ${d.pagamento} | Valor: R$${d.valorPago || '0'}\n`;
    });
    const blob = new Blob([conteudo], {type: 'application/pdf'});
    window.open(URL.createObjectURL(blob));
  });

  carregarLista();
</script>
