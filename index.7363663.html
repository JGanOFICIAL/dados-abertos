<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gestor de Documentos</title>
<style>
  * {
    margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif;
  }
  body {
    background:#fff; color:#000; padding:20px;
  }
  .container {
    max-width:960px; margin:0 auto;
  }
  .input-line {
    position:relative; margin:20px 0;
  }
  .input-line input {
    width:100%; border:none; border-bottom:2px solid #ccc; font-size:16px; padding:10px 0;
    background:transparent; font-weight:bold; transition:border-color 0.3s;
  }
  .input-line input:focus {
    border-color:#000;
    outline:none;
  }
  .btn {
    display:inline-block; background:#000; color:#fff; font-weight:bold; padding:12px 22px; border:none;
    cursor:pointer; margin-top:12px; transition:transform 0.1s ease;
    border-radius:4px;
  }
  .btn:active {
    transform:scale(0.96);
  }
  .btn.loading {
    opacity:0.6; pointer-events:none;
  }
  .toggle-link {
    text-align:center; color:#007bff; cursor:pointer; margin-top:12px; user-select:none;
  }
  .upload-box {
    border:2px dashed #999; padding:25px; text-align:center; border-radius:6px; margin:20px 0;
    cursor:pointer; transition:border-color 0.3s;
    font-weight:bold; color:#555;
  }
  .upload-box:hover {
    border-color:#000;
  }
  #realFileInput {
    display:none;
  }
  .search-area {
    display:flex; align-items:center; gap:12px; margin-bottom:20px;
  }
  .search-area input {
    flex:1; font-weight:bold; font-size:16px;
    border:none; border-bottom:2px solid #ccc; padding:8px 8px 8px 10px;
    transition:border-color 0.3s;
  }
  .search-area input:focus {
    border-color:#000;
    outline:none;
  }
  .search-area img {
    width:26px; height:26px; cursor:pointer; user-select:none;
    transition:opacity 0.3s;
  }
  .search-area img:active {
    opacity:0.6;
  }
  .user-info {
    margin-bottom:20px; font-size:14px; font-weight:bold;
    display:flex; flex-wrap:wrap; gap:15px; align-items:center;
  }
  .user-info span {
    min-width:120px;
  }
  #toggleUserInfoBtn {
    background:#333; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;
    user-select:none; border:none;
  }
  #fileList {
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
  }
  .file-card {
    background:#f9f9f9; border:2px solid #000; border-radius:8px; padding:15px;
    display:flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 3px 7px rgba(0,0,0,0.1);
  }
  .file-header {
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .file-header input[type=checkbox] {
    width:18px; height:18px; cursor:pointer;
  }
  .file-name {
    font-weight:bold; cursor:pointer; user-select:none; flex:1;
    word-break: break-word;
  }
  .file-meta {
    font-size:12px; color:#555; margin-bottom:10px;
  }
  .file-actions {
    display:flex; justify-content: flex-end; gap:12px;
  }
  .icon-btn {
    cursor:pointer; width:22px; height:22px; user-select:none;
    filter: invert(0); transition: filter 0.3s;
  }
  .icon-btn:hover {
    filter: invert(0.4);
  }
  #previewOverlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; flex-direction: column;
    z-index:9999; padding:15px;
  }
  #previewBox {
    width:90%; max-width:720px; height:85vh; background:#fff;
    border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.3);
    display:flex; flex-direction: column; overflow: hidden;
  }
  #previewFrame {
    flex-grow: 1; border:none; width:100%;
  }
  .overlay-btns {
    display:flex; justify-content:center; gap:15px; padding:12px; background:#222;
  }
  .overlay-btns button {
    background:#000; border:none; color:#fff; padding:10px 20px; font-weight:bold;
    border-radius:6px; cursor:pointer; transition: background-color 0.3s;
  }
  .overlay-btns button:hover {
    background:#444;
  }
  .loading-overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center;
    z-index:99999;
  }
  .spinner {
    border:6px solid #eee;
    border-top:6px solid #000;
    border-radius:50%;
    width:42px;
    height:42px;
    animation:spin 1s linear infinite;
  }
  @keyframes spin {
    0%{transform:rotate(0);}
    100%{transform:rotate(360deg);}
  }
  #previewList {
    max-height:120px; overflow-x:auto; margin-top:8px; display:flex; gap:10px; padding-bottom:5px;
  }
  .preview-item {
    flex-shrink: 0;
    border: 2px solid #000;
    border-radius: 6px;
    padding: 6px 10px;
    background: #fafafa;
    font-weight: bold;
    white-space: nowrap;
    cursor: default;
  }
</style>
</head>
<body>
<div class="container">
  <div id="errorBox" style="display:none; background:#ffebeb; color:#b30000; padding:10px; margin-bottom:12px; border:1px solid #b30000; border-radius:4px;"></div>

  <div id="loginForm">
    <div class="input-line"><input type="email" id="loginEmail" placeholder="Email"></div>
    <div class="input-line"><input type="password" id="loginPassword" placeholder="Senha"></div>
    <button class="btn" id="loginBtn">Entrar</button>
    <div class="toggle-link" onclick="toggleForms('register')">Não tem conta? Cadastrar</div>
  </div>

  <div id="registerForm" style="display:none;">
    <div class="input-line"><input type="text" id="registerName" placeholder="Nome completo"></div>
    <div class="input-line"><input type="text" id="registerCPF" placeholder="CPF (000.000.000‑00)"></div>
    <div class="input-line"><input type="email" id="registerEmail" placeholder="Email"></div>
    <div class="input-line"><input type="password" id="registerPassword" placeholder="Senha"></div>
    <button class="btn" onclick="togglePassword()">Mostrar/Ocultar Senha</button>
    <button class="btn" id="registerBtn">Cadastrar</button>
    <div class="toggle-link" onclick="toggleForms('login')">Já tem conta? Entrar</div>
  </div>

  <div id="app" style="display:none;">
    <div class="search-area">
      <input type="text" id="search" placeholder="Buscar documento…" autocomplete="off" />
      <img src="https://cdn-icons-png.flaticon.com/512/64/64673.png" alt="Buscar" title="Buscar" onclick="buscarAgora()" />
    </div>
    <div class="user-info" id="userInfo">
      <span><strong>Nome:</strong> <span id="userName">---</span></span>
      <span><strong>CPF:</strong> <span id="userCPF">---</span></span>
      <span><strong>Email:</strong> <span id="userEmail">---</span></span>
      <button class="btn" id="toggleUserInfoBtn">Ocultar Dados</button>
    </div>

    <div class="upload-box" onclick="document.getElementById('realFileInput').click()">
      Selecione arquivos (PDF, DOC, TXT)… (múltiplos permitidos)
      <input type="file" id="realFileInput" accept=".pdf,.doc,.docx,.txt" multiple />
    </div>
    <div id="previewList"></div>
    <button class="btn" id="uploadBtn" disabled>Adicionar Documento(s)</button>
    <button class="btn" id="logoutBtn">Sair</button>

    <div id="fileList"></div>
  </div>
</div>

<div id="previewOverlay">
  <div id="previewBox">
    <iframe id="previewFrame"></iframe>
    <div class="overlay-btns">
      <button class="btn" id="downloadDocBtn">Baixar</button>
      <button class="btn" id="deleteDocBtn">Excluir</button>
      <button class="btn" id="closePreview">Minimizar</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="script.js"></script>
</body>
</html>



<style>
#authOverlay {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  z-index: 99999;
  opacity: 1;
  transition: opacity 0.8s ease;
  user-select: none;
}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

#spinner {
  width: 70px;
  height: 70px;
  position: relative;
  --dot-size: 14px;
}

#spinner div {
  position: absolute;
  width: var(--dot-size);
  height: var(--dot-size);
  background: white;
  border-radius: 50%;
  animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
}

#spinner div:nth-child(1) {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  animation: dot1 1.2s infinite;
}

#spinner div:nth-child(2) {
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  animation: dot2 1.2s infinite;
}

#spinner div:nth-child(3) {
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  animation: dot3 1.2s infinite;
}

#spinner div:nth-child(4) {
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  animation: dot4 1.2s infinite;
}

@keyframes dot1 {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
  50% { transform: translateX(-50%) scale(0.5); opacity: 0.4; }
}
@keyframes dot2 {
  0%, 100% { transform: translateY(-50%) scale(1); opacity: 1; }
  50% { transform: translateY(-50%) scale(0.5); opacity: 0.4; }
}
@keyframes dot3 {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
  50% { transform: translateX(-50%) scale(0.5); opacity: 0.4; }
}
@keyframes dot4 {
  0%, 100% { transform: translateY(-50%) scale(1); opacity: 1; }
  50% { transform: translateY(-50%) scale(0.5); opacity: 0.4; }
}

#authMessage {
  font-family: monospace;
  letter-spacing: 2px;
  margin-bottom: 6px;
  min-height: 1.6em;
  user-select: none;
}

#authSubMessage {
  font-weight: 400;
  font-size: 1rem;
  color: #aaa;
  margin-bottom: 35px;
  text-align: center;
  max-width: 280px;
  user-select: none;
}

#companyName {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font-size: 0.8rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.12);
  font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  pointer-events: none;
  user-select: none;
}

#errorBox {
  text-align: center;
  max-width: 320px;
  padding: 20px;
  background: #330000;
  border: 1px solid #aa0000;
  border-radius: 8px;
  user-select: none;
}

#errorBox p {
  margin-bottom: 15px;
  color: #ff5555;
  font-weight: 600;
}

#errorBox button {
  background: #ff5555;
  border: none;
  padding: 10px 18px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  border-radius: 6px;
  font-size: 1rem;
  transition: background-color 0.3s ease;
  user-select: none;
}

#errorBox button:hover {
  background: #ff2222;
}
</style>

<div id="authOverlay" aria-live="polite" aria-busy="true" role="alert">
  <div id="spinner">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>
  <div id="authMessage" aria-label="Mensagem de autenticação"></div>
  <div id="authSubMessage">Garantimos a segurança do usuário</div>
</div>
<div id="companyName">San7Cloud</div>

<script>
  (function(){
    const overlay = document.getElementById("authOverlay");
    const authMsg = document.getElementById("authMessage");
    const authText = "AUTENTICANDO...";
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
    const scrambleIntervalTime = 70;
    const authDuration = 3000;
    let scrambleInterval = null;
    let mouseMoved = false;

    function isSupportedBrowser(){
      const ua = navigator.userAgent;
      const supported = [
        /Chrome\/\d+/i,
        /Firefox\/\d+/i,
        /Edg\/\d+/i,
        /Safari\/\d+/i
      ];
      return supported.some(r => r.test(ua));
    }

    function showError(message){
      overlay.innerHTML = `
        <div id="errorBox" role="alert" aria-live="assertive">
          <p>${message}</p>
          <button id="retryBtn" aria-label="Tentar novamente">Tentar novamente</button>
        </div>`;
      document.getElementById("retryBtn").onclick = () => location.reload();
    }

    function scramble(text){
      let res = "";
      for(let i=0; i<text.length; i++){
        if(text[i] === " "){
          res += " ";
          continue;
        }
        if(Math.random() < 0.3){
          res += text[i];
        } else {
          res += chars.charAt(Math.floor(Math.random() * chars.length));
        }
      }
      return res;
    }

    function startScramble(){
      scrambleInterval = setInterval(() => {
        authMsg.textContent = scramble(authText);
      }, scrambleIntervalTime);
    }

    function revealText(callback){
      clearInterval(scrambleInterval);
      let i = 0;
      const revealInterval = setInterval(() => {
        let displayed = "";
        for(let j=0; j<authText.length; j++){
          displayed += (j <= i) ? authText[j] : " ";
        }
        authMsg.textContent = displayed;
        i++;
        if(i > authText.length){
          clearInterval(revealInterval);
          if(callback) callback();
        }
      }, 60);
    }

    function fadeOutAndRemove(element, duration=800){
      element.style.opacity = 0;
      setTimeout(() => element.remove(), duration);
    }

    function validateMouseMovement(){
      if(!mouseMoved){
        showError("Movimento do mouse não detectado. Por favor, interaja com a página");
        return false;
      }
      return true;
    }

    function startAuth(){
      if(!isSupportedBrowser()){
        showError("Navegador não suportado.");
        return;
      }
      startScramble();

      setTimeout(() => {
        if(window.innerWidth > 768){ // presumindo desktop
          if(!validateMouseMovement()) return;
        }
        revealText(() => fadeOutAndRemove(overlay));
      }, authDuration);
    }

    window.addEventListener("mousemove", () => mouseMoved = true);
    window.addEventListener("keydown", () => mouseMoved = true);
    window.addEventListener("touchstart", () => mouseMoved = true);

    startAuth();
  })();
</script>
