    }
    
    async function uploadImage(file, btnElement) {
        if(btnElement) { btnElement.classList.add('btn-loading'); btnElement.disabled = true; }

able="true">${escapeHtml(order.garantia || '90 dias sobre os reparos realizados')}</span></div><div class="observacao-text"><strong>Observações:</strong><br><span contenteditable="true">${escapeHtml(order.observacoes || '---')}</span></div><div class="assinatura-area"><img src="${ASSINATURA_URL}"><div class="assinatura-texto"><div class="assinatura-negrito">${EMPRESA_NOME}</div><div class="assinatura-italico">${RESPONSAVEL}</div></div></div><div class="footer-note">ATENÇÃO! Cobramos taxas de diagnóstico em caso de orçamento não aprovado após informações do orçamento com indicações das peças necessárias e o serviço a ser realizado para o reparo. Valor da taxa diagnóstico 50% do valor da mão de obra descrito no orçamento.</div>`;

    async function generateAndDownloadImageFromPreview(type, order, docNumber, useStyle2) {

            });
        }
        document.getElementById('triggerUpload')?.addEventListener('click',()=>document.getElementById('newImagesUpload')?.click()); 
        document.getElementById('newImagesUpload')?.addEventListener('change',(e)=>{ tempFiles=Array.from(e.target.files); let previewDiv=document.getElementById('newPreviewArea'); previewDiv.innerHTML=''; tempFiles.forEach(f=>{ let reader=new FileReader(); reader.onload=ev=>{ let img=document.createElement('img'); img.src=ev.target.result; img.style.width='70px'; img.style.height='70px'; img.style.borderRadius='12px'; img.style.objectFit='cover'; previewDiv.appendChild(img); }; reader.readAsDataURL(f);}); }); 
        document.getElementById('closeFormBtn')?.addEventListener('click',()=>renderHomeScreen()); 
        document.getElementById('saveNewOrderBtn')?.addEventListener('click',async(e)=>{ let btn=e.currentTarget; let productName=document.getElementById('prodName').value; if(!productName){ showToast('Nome do drone obrigatório'); return; } let customer=document.getElementById('customerName').value; let telefone=document.getElementById('customerPhone').value; let brand=document.getElementById('brandField').value; let serial=document.getElementById('serialField').value; let description=document.getElementById('descField').value; let arrivalDateStr = document.getElementById('arrivalDateNew')?.value || '';
            let arrivalTimestamp = null;
            if(arrivalDateStr && arrivalDateStr.match(/\d{2}\/\d{2}\/\d{4}/)) {
                let [dia, mes, ano] = arrivalDateStr.split('/');
                arrivalTimestamp = new Date(ano, mes-1, dia).getTime();
            }
            let checkboxes = document.querySelectorAll('#formOverlay .checkbox-item input:checked');
            let itensSelecionados = Array.from(checkboxes).map(cb => cb.value);
            let itensFinais = [...itensSelecionados, ...itensExtras];
            let uploadedUrls=[]; 
            for(let file of tempFiles){ let url=await uploadImage(file, btn); if(url) uploadedUrls.push(url); } 
            let orderNumber = `${Math.floor(Math.random()*9000+1000)}-${new Date().getFullYear().toString().slice(-2)}`; 
            let uniqueId = generateUniqueId(); 
            let newOrder={ productName, customer, telefone, brand, serial, description, arrivalDate: arrivalTimestamp, arrivalDateStr, departureDate: null, createdAt: Date.now(), status:'Pendente', images:uploadedUrls, priceFinal:0, precoUnitario:0, quantidade:1, frete:0, desconto:0, metodoPagamento:'', defeito:'', solucoes:'', observacoes:'', garantia:'90 dias sobre os reparos realizados', orderNumber, uniqueId, descontoPix:0, jurosCartao:0, valorComJuros:0, itensAcompanhantes: itensFinais }; 
            let ref=ordensRef.push(); await ref.set(newOrder); showToast('Ordem criada'); renderHomeScreen(); }); 
    }
    
    document.addEventListener('contextmenu', function(e) { if(e.target.tagName === 'IMG') { e.preventDefault(); return false; } });
    document.addEventListener('dragstart', function(e) { if(e.target.tagName === 'IMG') { e.preventDefault(); return false; } });
    loadOrders();
</script>
</body>
</html>
