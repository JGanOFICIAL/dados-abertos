<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrativo | União Fitness</title><link rel="stylesheet" href="admin.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><header class="admin-header"><a class="admin-brand" href="index.html"><img id="adminLogo" alt=""><span>União Fitness <small>PAINEL ADMINISTRATIVO</small></span></a><div class="header-actions"><a href="index.html">Visualizar site</a><button id="adminRefresh">Atualizar</button></div></header>
<main class="admin-main"><section id="dashboard" class="panel"><div class="welcome-admin"><div><span class="kicker">CENTRAL DE CONTROLE</span><h1>Administrativo</h1><p>Gerencie inscrições, aparência e conteúdo do site.</p></div><div class="status-pill"><i></i><span id="connectionStatus">Conectando ao Firebase</span></div></div><div class="admin-tiles"><button class="tile" data-panel="event"><span class="tile-icon yellow">▣</span><strong>Criar evento</strong><small>Dados gerais e inscrição</small></button><button class="tile" data-panel="registrations"><span class="tile-icon blue">☷</span><strong>Lista de inscritos</strong><small>Pesquisa, exportação e sorteio</small></button><button class="tile" data-panel="images"><span class="tile-icon green">▧</span><strong>Imagens e aparência</strong><small>Logos, cores e tipografia</small></button><button class="tile" data-panel="content"><span class="tile-icon orange">▤</span><strong>Informações do site</strong><small>Conteúdo e prévia</small></button><button class="tile" data-panel="fields"><span class="tile-icon purple">☷</span><strong>Campos do formulário</strong><small>Até 30 tipos de campos</small></button><button class="tile" data-panel="payment"><span class="tile-icon teal">＄</span><strong>Pagamento e cupons</strong><small>Pix, valores e descontos</small></button></div><div class="dashboard-summary"><div><span>Inscrições totais</span><strong id="totalRegistrations">—</strong></div><div><span>Confirmadas</span><strong id="confirmedRegistrations">—</strong></div><div><span>Aguardando pagamento</span><strong id="pendingRegistrations">—</strong></div></div></section>
<section id="workPanel" class="panel hidden"><button class="back-button" id="backDashboard">← Painel principal</button><div id="panelContent"></div></section></main><div id="adminToast" class="admin-toast"></div><script src="admin.js"></script></body></html>
