<div id="admin-gate" style="position:fixed;inset:0;z-index:999999;background:rgba(10,15,25,.65);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px"><form id="admin-form" style="width:100%;max-width:340px;background:#fff;padding:28px;box-sizing:border-box;border-radius:0;font-family:Arial,sans-serif"><div style="font-size:12px;color:#667085;margin-bottom:8px;letter-spacing:1px">ÁREA RESTRITA</div><h2 style="margin:0 0 8px;color:#111827;font-size:22px">Administrativo</h2><p style="font-size:13px;color:#667085;margin:0 0 22px">Digite a senha para continuar.</p><input id="admin-password" type="password" placeholder="Senha de acesso" autocomplete="current-password" style="width:100%;height:46px;padding:0 12px;box-sizing:border-box;border:0;border-bottom:1px solid #d0d5dd;border-radius:0;background:#f8fafc;color:#111827;font-size:15px;outline:none"><div id="admin-error" style="display:none;color:#b42318;font-size:12px;margin-top:9px">Senha incorreta. Tente novamente.</div><button type="submit" style="width:100%;height:46px;margin-top:18px;border:0;border-radius:0;background:#111827;color:white;font-size:14px;font-weight:600;cursor:pointer">Entrar</button></form></div><script>(function(){var gate=document.getElementById('admin-gate'),form=document.getElementById('admin-form'),input=document.getElementById('admin-password'),error=document.getElementById('admin-error');if(!gate||!form||!input)return;try{if(localStorage.getItem('admin_gate_authenticated')==='true'){gate.remove();return}}catch(e){}form.addEventListener('submit',function(e){e.preventDefault();if(input.value==='2026'){try{localStorage.setItem('admin_gate_authenticated','true')}catch(e){}gate.style.transition='opacity .25s ease';gate.style.opacity='0';setTimeout(function(){gate.remove()},260)}else{error.style.display='block';input.value='';input.focus()}});input.addEventListener('input',function(){error.style.display='none'});setTimeout(function(){input.focus()},100)})();</script>
