<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo · União Fitness</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body data-page="admin" class="admin-body"><header class="admin-header"><a class="admin-brand" href="index.html"><img id="adminLogo" alt="Logo"><span><strong>União Fitness</strong><small>Painel administrativo</small></span></a><a class="btn-small" href="index.html">Ver site</a></header><main class="admin-shell"><div id="adminDashboard"><div class="admin-top"><div><p class="eyebrow">CENTRAL DE CONTROLE</p><h1 style="margin:0">Painel administrativo</h1><p style="margin:5px 0;color:#777">Gerencie inscrições, pagamentos e conteúdo do site.</p></div><span class="pill">Sem autenticação</span></div><div class="admin-grid"><button class="admin-tile" data-panel="event"><span class="admin-icon">✦</span><strong>Evento e formulário</strong><span>Nome, campos, termos, benefícios e cupons</span></button><button class="admin-tile" data-panel="registrations"><span class="admin-icon">▤</span><strong>Lista de inscritos</strong><span>Pesquisar, exportar e realizar sorteios</span></button><button class="admin-tile" data-panel="images"><span class="admin-icon">▧</span><strong>Imagens e identidade</strong><span>Logos, boas-vindas e patrocinadores</span></button><button class="admin-tile" data-panel="content"><span class="admin-icon">＋</span><strong>Informações do site</strong><span>Prévia e blocos de conteúdo</span></button><button class="admin-tile" data-panel="payments"><span class="admin-icon">＄</span><strong>Pagamentos</strong><span>Pix, valores e validação de inscrições</span></button><button class="admin-tile" data-panel="accounts"><span class="admin-icon">♙</span><strong>Contas</strong><span>Consultar e excluir contas cadastradas</span></button><button class="admin-tile" data-panel="scanner"><span class="admin-icon">▦ <div id="login" style="position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:Arial,sans-serif"><div style="width:320px;max-width:85%;padding:35px 25px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;box-shadow:0 15px 50px rgba(0,0,0,.25);text-align:center;color:white"><h2 style="margin:0 0 10px;font-size:25px">Acesso restrito</h2><p style="margin:0 0 25px;color:rgba(255,255,255,.75);font-size:14px">Digite a senha para continuar</p><input id="senhaLogin" type="password" placeholder="Digite sua senha" style="box-sizing:border-box;width:100%;padding:14px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.15);color:white;outline:none;font-size:15px;text-align:center"><button onclick="verificarLogin()" style="width:100%;margin-top:15px;padding:14px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:bold;font-size:15px;cursor:pointer">Entrar</button><p id="erroLogin" style="color:#ff7777;font-size:13px;margin:12px 0 0;display:none">Senha incorreta. Tente novamente.</p></div></div><style>#senhaLogin::placeholder{color:rgba(255,255,255,.65)}#login button:active{transform:scale(.98)}</style><script>function verificarLogin(){if(document.getElementById('senhaLogin').value==='2026'){localStorage.setItem('site_autorizado','true');document.getElementById('login').remove()}else{document.getElementById('erroLogin').style.display='block';document.getElementById('senhaLogin').value=''}}if(localStorage.getItem('site_autorizado')==='true'){document.getElementById('login').remove()}document.getElementById('senhaLogin').addEventListener('keydown',function(e){if(e.key==='Enter')verificarLogin()});</script>
