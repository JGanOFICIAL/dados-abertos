<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Painel Admin • Planos de Saúde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #c48b4c;
      font-family: 'Inter', sans-serif;
      padding: 16px 12px 40px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .admin-container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 4px;
      padding: 20px 16px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }
    h2 {
      color: #4a3620;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.4rem;
      border-bottom: 2px solid #c48b4c;
      padding-bottom: 10px;
    }
    .empresa-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .empresa-btn {
      background: white;
      border: 1px solid #c48b4c;
      padding: 8px 16px;
      border-radius: 2px;
      font-weight: 600;
      font-size: 0.8rem;
      color: #5e3e1c;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .empresa-btn.active {
      background: #c48b4c;
      border-color: #c48b4c;
      color: white;
    }
    .planos-list {
      background: #fef9f2;
      border-radius: 4px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 500px;
      overflow-y: auto;
    }
    .plano-header {
      display: grid;
      grid-template-columns:1fr 1fr 2fr 1fr 1.5fr 80px;
      gap: 6px;
      padding: 8px 10px;
      background: #f5efe5;
      border-radius: 2px;
      font-weight: 700;
      font-size: 0.7rem;
      color: #4a3620;
      text-transform: uppercase;
      align-items: center;
    }
    .plano-card {
      background: white;
      border-radius: 2px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns:1fr 1fr 2fr 1fr 1.5fr 80px;
      gap: 6px;
      border: 1px solid #ebd9c0;
      align-items: center;
    }
    .plano-card input {
      border: 1px solid #999;
      border-radius: 0px;
      padding: 6px 8px;
      font-size: 0.75rem;
      background: #fffdf9;
      outline: none;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }
    .acoes {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .save-btn { color: #2d5e2c; }
    .delete-btn { color: #b55a3a; }
    button:hover { opacity: 0.7; }
    .add-btn {
      background: #c48b4c;
      color: white;
      border-radius: 2px;
      padding: 10px 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      margin-top: 6px;
      width: fit-content;
    }
    .empty-message {
      text-align: center;
      color: #b1946e;
      padding: 24px;
      font-style: italic;
    }
    @media (max-width:700px) {
      .plano-header, .plano-card {
        grid-template-columns:1fr 1fr 1fr;
        font-size:0.7rem;
      }
      .acoes { grid-column:span 3; justify-content:flex-end; }
    }
  </style>
</head>
<body>
<div class="admin-container" id="adminRoot">
  <h2><i class="fas fa-cogs" style="color:#c48b4c"></i> Painel Administrativo</h2>
  <div id="empresaBotoes" class="empresa-grid"></div>
  <div id="planosContainer" class="planos-list"></div>
  <div id="mensagem"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",
    databaseURL: "https://san7-brasil-default-rtdb.firebaseio.com",
    projectId: "san7-brasil",
    authDomain: "san7-brasil.firebaseapp.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const EMPRESAS = ['Unimed','Viver Mais','Humana','HapVida','Bradesco Saúde','Sul América','Amil'];
  let empresaAtiva = 'Unimed';
  let dadosEmpresas = {};

  function inicializarDados() {
    EMPRESAS.forEach(nome => {
      db.ref('empresas/' + nome).once('value').then(snap => {
        if (!snap.exists()) {
          db.ref('empresas/' + nome).set({ nome: nome, planos: {} });
        }
      });
    });
  }

  function carregarTudo() {
    db.ref('empresas').on('value', snapshot => {
      dadosEmpresas = snapshot.val() || {};
      renderizarAdmin();
    });
  }

  function renderizarAdmin() {
    const botoesDiv = document.getElementById('empresaBotoes');
    botoesDiv.innerHTML = EMPRESAS.map(nome =>
      `<button class="empresa-btn ${empresaAtiva === nome ? 'active' : ''}" data-empresa="${nome}">
        <i class="fas fa-building"></i> ${nome}
      </button>`
    ).join('');
    document.querySelectorAll('.empresa-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        empresaAtiva = this.dataset.empresa;
        renderizarAdmin();
      });
    });
    renderizarPlanos();
  }

  function obterPlanosAtuais() {
    const empresaData = dadosEmpresas[empresaAtiva];
    if (!empresaData || !empresaData.planos) return [];
    return Object.entries(empresaData.planos).map(([id, plano]) => ({ id, ...plano }));
  }

  function renderizarPlanos() {
    const container = document.getElementById('planosContainer');
    const planos = obterPlanosAtuais();
    let html = `<div class="plano-header">
      <span>Idade Início</span><span>Idade Fim</span><span>Nome do Plano</span><span>Preço R$</span><span>Detalhes</span><span>Ações</span>
    </div>`;
    if (planos.length === 0) {
      html += `<div class="empty-message"><i class="far fa-folder-open"></i> Nenhum plano em ${empresaAtiva}. Adicione abaixo.</div>`;
    } else {
      html += planos.map(plano => `
        <div class="plano-card" data-id="${plano.id}">
          <input placeholder="18" value="${plano.idadeInicio || ''}" data-campo="idadeInicio" type="number">
          <input placeholder="25" value="${plano.idadeFim || ''}" data-campo="idadeFim" type="number">
          <input placeholder="Plano Essencial" value="${plano.nomePlano || ''}" data-campo="nomePlano">
          <input placeholder="199.90" value="${plano.valor || ''}" data-campo="valor" type="number" step="0.01">
          <input placeholder="Particular" value="${plano.detalhes || ''}" data-campo="detalhes">
          <div class="acoes">
            <button class="save-btn" title="Salvar"><i class="fas fa-save"></i></button>
            <button class="delete-btn" title="Excluir"><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
      `).join('');
    }
    html += `<button class="add-btn" id="addPlanoBtn"><i class="fas fa-plus-circle"></i> Adicionar Plano</button>`;
    container.innerHTML = html;

    document.querySelectorAll('.plano-card').forEach(card => {
      const id = card.dataset.id;
      card.querySelector('.save-btn')?.addEventListener('click', () => salvarPlano(id, card));
      card.querySelector('.delete-btn')?.addEventListener('click', () => excluirPlano(id));
    });
    document.getElementById('addPlanoBtn')?.addEventListener('click', adicionarPlano);
  }

  function salvarPlano(id, cardElement) {
    const inputs = cardElement.querySelectorAll('input');
    const dados = {};
    inputs.forEach(inp => {
      dados[inp.dataset.campo] = inp.value;
    });
    db.ref(`empresas/${empresaAtiva}/planos/${id}`).update(dados).then(() => {
      mostrarMensagem('Plano salvo!');
    });
  }

  function excluirPlano(id) {
    if (confirm('Excluir este plano?')) {
      db.ref(`empresas/${empresaAtiva}/planos/${id}`).remove().then(() => {
        mostrarMensagem('Plano removido.');
      });
    }
  }

  function adicionarPlano() {
    const novoRef = db.ref(`empresas/${empresaAtiva}/planos`).push();
    novoRef.set({
      idadeInicio: '',
      idadeFim: '',
      nomePlano: '',
      valor: '',
      detalhes: ''
    }).then(() => mostrarMensagem('Novo plano adicionado.'));
  }

  function mostrarMensagem(texto) {
    const msg = document.getElementById('mensagem');
    msg.innerHTML = `<div style="background:#e7f3e7;color:#2d5e2c;padding:8px 16px;border-radius:2px;font-size:0.8rem">${texto}</div>`;
    setTimeout(() => msg.innerHTML = '', 2000);
  }

  inicializarDados();
  carregarTudo();
</script>
</body>
</html>
