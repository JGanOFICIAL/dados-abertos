<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Dronup · Consulta de Ordem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #F5F7FA; font-family: 'Inter', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; background: #FFFFFF; min-height: 100vh; position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.05); }
        .header { background: #0B2B5E; padding: 28px 24px 24px; color: white; position: sticky; top: 0; z-index: 10; }
        .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.3px; }
        .header p { font-size: 0.7rem; opacity: 0.85; margin-top: 4px; }
        .search-area { padding: 24px 20px; background: white; border-bottom: 1px solid #E5E9F0; display: flex; gap: 12px; align-items: center; }
        .search-input { flex: 1; padding: 10px 12px; border: 1px solid #CBD5E1; background: white; font-family: 'Inter', sans-serif; font-size: 0.9rem; border-radius: 0px; outline: none; }
        .search-input:focus { border-color: #0B2B5E; }
        .btn-buscar { background: #0B2B5E; border: none; color: white; padding: 10px 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; border-radius: 0px; transition: 0.1s; letter-spacing: 0.3px; }
        .btn-buscar:active { background: #1a3d6e; transform: scale(0.97); }
        .result-area { padding: 20px; display: none; }
        .loading-area { display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #E2E8F0; border-top-color: #0B2B5E; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .order-card { background: white; border: 1px solid #E2E8F0; margin-bottom: 20px; }
        .order-header { padding: 16px; border-bottom: 1px dashed #CBD5E1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .order-num { font-weight: 700; font-size: 0.9rem; color: #0B2B5E; }
        .status-badge { display: inline-block; padding: 4px 10px; font-size: 0.65rem; font-weight: 700; background: #F1F5F9; color: #1E293B; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px dashed #E2E8F0; }
        .info-label { font-weight: 600; font-size: 0.8rem; color: #475569; }
        .info-value { font-weight: 500; font-size: 0.8rem; color: #1E293B; text-align: right; word-break: break-word; max-width: 60%; }
        .photos-section { padding: 16px; border-top: 1px dashed #E2E8F0; }
        .photos-title { font-size: 0.75rem; font-weight: 600; color: #475569; margin-bottom: 12px; }
        .photo-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .photo-thumb { width: 70px; height: 70px; object-fit: cover; border: 1px solid #E2E8F0; cursor: pointer; background: #F8FAFC; }
        .image-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; display: flex; align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(6px); }
        .full-image { max-width: 90%; max-height: 70%; object-fit: contain; border: none; }
        .close-overlay { position: absolute; top: 24px; right: 24px; color: white; background: rgba(0,0,0,0.5); padding: 8px; cursor: pointer; font-size: 28px; }
        .error-msg { background: #FEF2F2; color: #C2410C; padding: 14px; text-align: center; font-size: 0.8rem; margin: 20px; border-left: 3px solid #C2410C; }
        .watermark { position: fixed; bottom: 20px; right: 20px; opacity: 0.04; z-index: 0; width: 90px; pointer-events: none; }
        .toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1E293B; color: white; padding: 8px 18px; border-radius: 0px; z-index: 1200; font-size: 0.75rem; }
        img { -webkit-touch-callout: none; user-select: none; pointer-events: auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Dronup</h1>
        <p>consulta de ordem de serviço</p>
    </div>
    <div class="search-area" id="searchArea">
        <input type="tel" id="phoneInput" class="search-input" placeholder="Número de telefone (ex: 84999995555)" autocomplete="off">
        <button id="buscarBtn" class="btn-buscar">Buscar</button>
    </div>
    <div id="loadingArea" class="loading-area" style="display: none;">
        <div class="spinner"></div>
    </div>
    <div id="resultArea" class="result-area"></div>
    <img src="https://lh3.googleusercontent.com/sitesv/AA5AbUDT_PaB_2d-egJ57cKsTxqRd9XCDpd-jy3FwWFVdkCLRszJUpRT96P9PefCobOsw6VCxIWuaG5PxNVn8MFj1WlBvm196eoUQy9-4o0g6yMPdHivixZPyC5_SrL33goM-JmInMv7a8SswVTQXNM-sqVe5TzEqU5dsRLjLa3aFQ99WwodMluHHULK0m2ihB2yX6pQl41eiF_ySzdI99QL9cky52tWU8uHUD6VgFQ=w1280" class="watermark" alt="">
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",
        databaseURL: "https://san7-brasil-default-rtdb.firebaseio.com",
        projectId: "san7-brasil",
        authDomain: "san7-brasil.firebaseapp.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast-msg';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }

    function maskPhoneNumber(number) {
        if (!number) return '---';
        let cleaned = number.toString().replace(/\D/g, '');
        if (cleaned.length <= 4) return cleaned;
        return '****' + cleaned.slice(-4);
    }

    function formatDate(timestamp) {
        if (!timestamp) return 'Não registrado';
        return new Date(timestamp).toLocaleString('pt-BR');
    }

    function getStatusColor(status) {
        const map = {
            'Pendente': '#E67E22',
            'Aguardando aprovação': '#F39C12',
            'Aguardando pagamento': '#3498DB',
            'Em andamento': '#2ECC71',
            'Concluído': '#27AE60',
            'Cancelado': '#E74C3C'
        };
        return map[status] || '#7F8C8D';
    }

    function showFullImage(url) {
        let div = document.createElement('div');
        div.className = 'image-overlay';
        div.innerHTML = `<img src="${url}" class="full-image" draggable="false"><span class="close-overlay material-symbols-outlined">close</span>`;
        document.body.appendChild(div);
        div.querySelector('.close-overlay').addEventListener('click', () => div.remove());
        div.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
        div.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });
    }

    function renderOrder(order) {
        const statusColor = getStatusColor(order.status);
        const fotos = (order.images || []).map(img => `<img src="${img}" class="photo-thumb" data-img="${img}" draggable="false">`).join('');
        
        let html = `
            <div class="order-card">
                <div class="order-header">
                    <span class="order-num">${escapeHtml(order.orderNumber || order.id.slice(-6))}</span>
                    <span class="status-badge" style="background: ${statusColor}15; color: ${statusColor};">${order.status || 'Pendente'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Cliente</span>
                    <span class="info-value">${escapeHtml(order.customer || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Telefone</span>
                    <span class="info-value">${maskPhoneNumber(order.telefone)}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Drone</span>
                    <span class="info-value">${escapeHtml(order.productName || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Data de entrada</span>
                    <span class="info-value">${formatDate(order.arrivalDate || order.createdAt)}</span>
                </div>
                ${order.departureDate ? `<div class="info-row"><span class="info-label">Data de saída</span><span class="info-value">${formatDate(order.departureDate)}</span></div>` : ''}
                ${order.status === 'Concluído' ? `<div class="info-row"><span class="info-label">Concluído em</span><span class="info-value">${order.departureDate ? formatDate(order.departureDate) : formatDate(order.updatedAt || order.createdAt)}</span></div>` : ''}
            </div>
        `;
        
        if (fotos) {
            html += `<div class="order-card"><div class="photos-section"><div class="photos-title">Fotos do serviço</div><div class="photo-grid">${fotos}</div></div></div>`;
        }
        
        document.getElementById('resultArea').innerHTML = html;
        
        document.querySelectorAll('.photo-thumb').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                showFullImage(el.dataset.img);
            });
            el.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
            el.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function buscarPorTelefone(telefone) {
        let telefoneLimpo = telefone.toString().replace(/\D/g, '');
        if (telefoneLimpo.length < 8) {
            showToast('Digite um número de telefone válido');
            return null;
        }
        
        const searchArea = document.getElementById('searchArea');
        const loadingDiv = document.getElementById('loadingArea');
        const resultDiv = document.getElementById('resultArea');
        
        searchArea.style.display = 'none';
        loadingDiv.style.display = 'flex';
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        
        const snap = await db.ref('ordens').once('value');
        const ordens = snap.val();
        if (!ordens) {
            loadingDiv.style.display = 'none';
            searchArea.style.display = 'flex';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error-msg">Nenhuma ordem encontrada para este telefone.</div>';
            return null;
        }
        
        let foundOrder = null;
        for (let id in ordens) {
            const ordem = ordens[id];
            const telefoneOrdem = (ordem.telefone || '').replace(/\D/g, '');
            if (telefoneOrdem === telefoneLimpo) {
                foundOrder = { id, ...ordem };
                break;
            }
        }
        
        loadingDiv.style.display = 'none';
        
        if (foundOrder) {
            resultDiv.style.display = 'block';
            renderOrder(foundOrder);
        } else {
            searchArea.style.display = 'flex';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error-msg">Nenhuma ordem encontrada para este número de telefone.</div>';
        }
        return foundOrder;
    }

    document.getElementById('buscarBtn').addEventListener('click', async () => {
        const telefone = document.getElementById('phoneInput').value.trim();
        if (!telefone) {
            showToast('Informe o telefone para consulta');
            return;
        }
        await buscarPorTelefone(telefone);
    });

    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('buscarBtn').click();
        }
    });

    document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
        }
    });
    document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
