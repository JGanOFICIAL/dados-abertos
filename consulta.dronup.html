<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Dronup · Acompanhamento de Ordem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #F1F5F9; font-family: 'Inter', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; background: #FFFFFF; min-height: 100vh; position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.06); }
        @media (min-width: 768px) { .container { margin: 20px auto; border-radius: 32px; overflow: hidden; } }
        .header { background: #0B2B5E; padding: 28px 20px 24px; color: white; }
        .header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .header p { font-size: 0.75rem; opacity: 0.9; margin-top: 4px; }
        .search-card { background: white; margin: -20px 18px 16px; padding: 20px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 6px; color: #1E293B; }
        .input-group input { width: 100%; padding: 14px 16px; border: 1px solid #CBD5E1; border-radius: 16px; font-size: 1rem; font-family: 'Inter', sans-serif; }
        .btn-consultar { background: #0B2B5E; color: white; border: none; padding: 14px; width: 100%; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.1s; }
        .btn-consultar:active { transform: scale(0.97); background: #1a3d6e; }
        .result-area { padding: 8px 18px 30px; display: none; }
        .order-card-detail { background: white; border-radius: 24px; padding: 20px; border: 1px solid #E2E8F0; margin-bottom: 16px; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: 700; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EDF2F7; }
        .info-label { font-weight: 600; color: #475569; }
        .info-value { font-weight: 500; color: #1E293B; text-align: right; max-width: 60%; word-break: break-word; }
        .photo-grid-consulta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
        .photo-thumb-consulta { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; }
        .image-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(8px); }
        .full-image { max-width: 90%; max-height: 70%; border-radius: 24px; }
        .close-overlay { position: absolute; top: 20px; right: 20px; color: white; background: rgba(0,0,0,0.5); border-radius: 50%; padding: 8px; cursor: pointer; }
        .toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1E293B; color: white; padding: 10px 20px; border-radius: 12px; z-index: 1200; font-size: 0.8rem; font-weight: 500; }
        .chip-items { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .item-chip { background: #EFF3FC; border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600; }
        .loading-spinner { text-align: center; padding: 40px; }
        .error-message { background: #FEF2F2; color: #DC2626; padding: 16px; border-radius: 16px; text-align: center; margin-top: 20px; }
        .watermark-logo { position: fixed; bottom: 20px; right: 20px; opacity: 0.08; z-index: 0; width: 100px; pointer-events: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Dronup</h1>
        <p>acompanhamento de ordem de serviço</p>
    </div>
    <div class="search-card">
        <div class="input-group">
            <label>Número do pedido ou telefone</label>
            <input type="text" id="searchInput" placeholder="Ex: DRN-1234 ou (84) 99999-9999">
        </div>
        <button class="btn-consultar" id="consultarBtn">Consultar</button>
    </div>
    <div id="resultArea" class="result-area"></div>
    <img src="https://lh3.googleusercontent.com/sitesv/AA5AbUDT_PaB_2d-egJ57cKsTxqRd9XCDpd-jy3FwWFVdkCLRszJUpRT96P9PefCobOsw6VCxIWuaG5PxNVn8MFj1WlBvm196eoUQy9-4o0g6yMPdHivixZPyC5_SrL33goM-JmInMv7a8SswVTQXNM-sqVe5TzEqU5dsRLjLa3aFQ99WwodMluHHULK0m2ihB2yX6pQl41eiF_ySzdI99QL9cky52tWU8uHUD6VgFQ=w1280" class="watermark-logo" alt="">
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",
        databaseURL: "https://san7-brasil-default-rtdb.firebaseio.com",
        projectId: "san7-brasil",
        authDomain: "san7-brasil.firebaseapp.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast-msg';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function getStatusColor(status) {
        const colors = {
            'Pendente': '#E67E22',
            'Aguardando aprovação': '#F39C12',
            'Aguardando pagamento': '#3498DB',
            'Em andamento': '#2ECC71',
            'Concluído': '#27AE60',
            'Cancelado': '#E74C3C'
        };
        return colors[status] || '#7F8C8D';
    }

    function formatDate(timestamp) {
        if (!timestamp) return 'Não registrado';
        return new Date(timestamp).toLocaleString('pt-BR');
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
    }

    function decryptOrderId(token) {
        try {
            const decoded = atob(token.replace('dronup2025', ''));
            return decoded;
        } catch(e) {
            return null;
        }
    }

    function showFullImage(url) {
        let div = document.createElement('div');
        div.className = 'image-overlay';
        div.innerHTML = `<img src="${url}" class="full-image"><span class="close-overlay material-symbols-outlined">close</span>`;
        document.body.appendChild(div);
        div.querySelector('.close-overlay').addEventListener('click', () => div.remove());
    }

    function renderOrder(order) {
        const resultDiv = document.getElementById('resultArea');
        const statusColor = getStatusColor(order.status);
        const itensLista = (order.itensAcompanhantes || []).map(item => `<span class="item-chip">${escapeHtml(item)}</span>`).join('');
        const fotos = (order.images || []).map(img => `<img src="${img}" class="photo-thumb-consulta" data-img="${img}">`).join('');
        
        let html = `
            <div class="order-card-detail">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
                    <span style="font-weight: 800; font-size: 1.1rem;">${escapeHtml(order.orderNumber || order.id.slice(-6))}</span>
                    <span class="status-badge" style="background: ${statusColor}20; color: ${statusColor};">${order.status || 'Pendente'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Cliente</span>
                    <span class="info-value">${escapeHtml(order.customer || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Telefone</span>
                    <span class="info-value">${escapeHtml(order.telefone || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Drone</span>
                    <span class="info-value">${escapeHtml(order.productName || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Marca</span>
                    <span class="info-value">${escapeHtml(order.brand || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Nº Série</span>
                    <span class="info-value">${escapeHtml(order.serial || '---')}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Data de Entrada</span>
                    <span class="info-value">${formatDate(order.arrivalDate || order.createdAt)}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Previsão/ Saída</span>
                    <span class="info-value">${order.departureDate ? formatDate(order.departureDate) : 'Em andamento'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Valor Total</span>
                    <span class="info-value">${formatCurrency(order.priceFinal)}</span>
                </div>
                ${order.metodoPagamento ? `<div class="info-row"><span class="info-label">Pagamento</span><span class="info-value">${escapeHtml(order.metodoPagamento)}</span></div>` : ''}
                ${itensLista ? `<div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 8px;"><span class="info-label">Itens que acompanham</span><div class="chip-items">${itensLista}</div></div>` : ''}
                ${order.defeito ? `<div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 8px;"><span class="info-label">Defeito relatado</span><span class="info-value" style="text-align: left; max-width: 100%;">${escapeHtml(order.defeito)}</span></div>` : ''}
                ${order.solucoes ? `<div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 8px;"><span class="info-label">Solução aplicada</span><span class="info-value" style="text-align: left; max-width: 100%;">${escapeHtml(order.solucoes)}</span></div>` : ''}
                ${order.observacoes ? `<div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 8px;"><span class="info-label">Observações</span><span class="info-value" style="text-align: left; max-width: 100%;">${escapeHtml(order.observacoes)}</span></div>` : ''}
                ${order.garantia ? `<div class="info-row" style="flex-direction: column; align-items: flex-start; gap: 8px;"><span class="info-label">Garantia</span><span class="info-value" style="text-align: left; max-width: 100%;">${escapeHtml(order.garantia)}</span></div>` : ''}
            </div>
        `;
        
        if (fotos) {
            html += `<div class="order-card-detail"><div class="info-label" style="margin-bottom: 12px;">Fotos do serviço</div><div class="photo-grid-consulta">${fotos}</div></div>`;
        }
        
        resultDiv.innerHTML = html;
        resultDiv.style.display = 'block';
        
        document.querySelectorAll('.photo-thumb-consulta').forEach(el => {
            el.addEventListener('click', () => {
                showFullImage(el.dataset.img);
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function buscarPorToken(token) {
        let orderId = null;
        try {
            const decoded = atob(token);
            if (decoded && decoded.includes('dronup2025')) {
                orderId = decoded.replace('dronup2025', '');
            }
        } catch(e) {}
        
        if (orderId) {
            const snap = await db.ref('ordens/' + orderId).once('value');
            if (snap.exists()) {
                renderOrder({ id: orderId, ...snap.val() });
                return true;
            }
        }
        return false;
    }

    async function buscarPorTelefoneOuNumero(termo) {
        const snap = await db.ref('ordens').once('value');
        const ordens = snap.val();
        if (!ordens) return null;
        
        const termoLower = termo.toLowerCase().replace(/\D/g, '');
        for (let id in ordens) {
            const ordem = ordens[id];
            const telefoneClean = (ordem.telefone || '').replace(/\D/g, '');
            const numeroPedido = (ordem.orderNumber || '').toLowerCase();
            const uniqueId = (ordem.uniqueId || '').toLowerCase();
            
            if (telefoneClean === termoLower || 
                numeroPedido === termoLower ||
                uniqueId === termoLower ||
                id === termo) {
                return { id, ...ordem };
            }
        }
        return null;
    }

    async function consultar() {
        const searchInput = document.getElementById('searchInput');
        const termo = searchInput.value.trim();
        const resultDiv = document.getElementById('resultArea');
        
        if (!termo) {
            showToast('Digite o número do pedido ou telefone');
            return;
        }
        
        resultDiv.innerHTML = '<div class="loading-spinner"><span class="material-symbols-outlined" style="animation: spin 1s linear infinite; display: inline-block;">progress_activity</span> Consultando...</div>';
        resultDiv.style.display = 'block';
        
        // verificar se veio via token na URL
        const urlParams = new URLSearchParams(window.location.search);
        const tokenUrl = urlParams.get('token');
        let encontrado = false;
        
        if (tokenUrl) {
            encontrado = await buscarPorToken(tokenUrl);
        }
        
        if (!encontrado) {
            const ordem = await buscarPorTelefoneOuNumero(termo);
            if (ordem) {
                renderOrder(ordem);
                encontrado = true;
            }
        }
        
        if (!encontrado) {
            resultDiv.innerHTML = '<div class="error-message"><span class="material-symbols-outlined" style="vertical-align: middle;">error</span> Nenhuma ordem encontrada com os dados informados.</div>';
        }
    }

    document.getElementById('consultarBtn').addEventListener('click', consultar);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') consultar();
    });

    // verificar token na URL automaticamente
    window.addEventListener('load', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            document.getElementById('searchInput').value = '';
            const resultDiv = document.getElementById('resultArea');
            resultDiv.innerHTML = '<div class="loading-spinner"><span class="material-symbols-outlined" style="animation: spin 1s linear infinite; display: inline-block;">progress_activity</span> Carregando...</div>';
            resultDiv.style.display = 'block';
            const encontrado = await buscarPorToken(token);
            if (!encontrado) {
                resultDiv.innerHTML = '<div class="error-message">Link inválido ou ordem não encontrada.</div>';
            }
        }
    });

    // animação simples
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
</script>
</body>
</html>
