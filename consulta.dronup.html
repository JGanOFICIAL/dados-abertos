<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Dronup · Consulta de Ordem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #F4F7FB; font-family: 'Inter', sans-serif; }
        .container { max-width: 580px; margin: 0 auto; background: #FFFFFF; min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.04); }
        .header { background: #0B2B5E; padding: 32px 24px 28px; color: white; position: sticky; top: 0; z-index: 10; }
        .header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.3px; }
        .header p { font-size: 0.75rem; opacity: 0.85; margin-top: 6px; }
        .search-card { padding: 28px 24px 24px; background: white; border-bottom: 1px solid #EFF3F8; }
        .search-label { font-size: 0.75rem; font-weight: 600; color: #1E293B; margin-bottom: 8px; display: block; letter-spacing: 0.3px; }
        .search-wrapper { display: flex; gap: 12px; align-items: center; }
        .search-input { flex: 1; padding: 14px 16px; border: 1.5px solid #E2E8F0; background: white; font-family: 'Inter', sans-serif; font-size: 0.95rem; border-radius: 0px; outline: none; transition: 0.15s; color: #0F172A; font-weight: 500; }
        .search-input:focus { border-color: #0B2B5E; box-shadow: 0 0 0 2px rgba(11,43,94,0.08); }
        .btn-buscar { background: #0B2B5E; border: none; color: white; padding: 14px 28px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border-radius: 0px; transition: 0.1s; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .btn-buscar:active { background: #1a3d6e; transform: scale(0.97); }
        .loading-area { display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
        .spinner { width: 44px; height: 44px; border: 3px solid #E2E8F0; border-top-color: #0B2B5E; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-area { padding: 20px; display: none; }
        .comprovante-card { background: white; border: 1px solid #E2E8F0; margin-bottom: 24px; }
        .comprovante-header { padding: 18px 20px; border-bottom: 1px dashed #CBD5E1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: #FAFCFE; }
        .comprovante-num { font-weight: 800; font-size: 1rem; color: #0B2B5E; letter-spacing: -0.2px; }
        .status-badge { display: inline-block; padding: 5px 12px; font-size: 0.7rem; font-weight: 700; background: #F1F5F9; color: #1E293B; border-left: 2px solid currentColor; }
        .info-linha { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px dashed #E9EDF2; }
        .info-label { font-weight: 600; font-size: 0.8rem; color: #334155; }
        .info-value { font-weight: 500; font-size: 0.85rem; color: #0F172A; text-align: right; word-break: break-word; max-width: 60%; }
        .fotos-bloco { padding: 16px 20px 20px; border-top: 1px dashed #E9EDF2; background: white; }
        .fotos-titulo { font-size: 0.75rem; font-weight: 700; color: #334155; margin-bottom: 14px; letter-spacing: 0.3px; }
        .photo-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .photo-item { width: 80px; height: 80px; object-fit: cover; border: 1px solid #E2E8F0; cursor: pointer; background: #F8FAFC; transition: 0.1s; }
        .photo-item:active { opacity: 0.8; }
        .btn-download-comprovante { background: #0B2B5E; border: none; color: white; padding: 16px; width: 100%; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 0px; transition: 0.1s; letter-spacing: 0.5px; }
        .btn-download-comprovante:active { background: #1a3d6e; transform: scale(0.98); }
        .error-msg { background: #FEF2F2; color: #C2410C; padding: 14px; text-align: center; font-size: 0.8rem; margin: 20px; border-left: 3px solid #C2410C; font-weight: 500; }
        .watermark-logo { position: fixed; bottom: 20px; right: 20px; opacity: 0.04; z-index: 0; width: 100px; pointer-events: none; }
        .toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1E293B; color: white; padding: 10px 20px; border-radius: 0px; z-index: 1200; font-size: 0.8rem; font-weight: 500; }
        .image-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.94); z-index: 2000; display: flex; align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(6px); }
        .full-image { max-width: 90%; max-height: 70%; object-fit: contain; border: none; }
        .close-overlay { position: absolute; top: 24px; right: 24px; color: white; background: rgba(0,0,0,0.5); padding: 8px; cursor: pointer; font-size: 28px; }
        img { -webkit-touch-callout: none; user-select: none; pointer-events: auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Dronup</h1>
        <p>consulta e comprovante</p>
    </div>
    <div class="search-card" id="searchCard">
        <label class="search-label">Telefone</label>
        <div class="search-wrapper">
            <input type="tel" id="phoneInput" class="search-input" placeholder="(84) 99999-9999" autocomplete="off">
            <button id="buscarBtn" class="btn-buscar"><span class="material-symbols-outlined" style="font-size: 1.2rem;">search</span> Buscar</button>
        </div>
    </div>
    <div id="loadingArea" class="loading-area" style="display: none;">
        <div class="spinner"></div>
    </div>
    <div id="resultArea" class="result-area"></div>
    <img src="https://lh3.googleusercontent.com/sitesv/AA5AbUDT_PaB_2d-egJ57cKsTxqRd9XCDpd-jy3FwWFVdkCLRszJUpRT96P9PefCobOsw6VCxIWuaG5PxNVn8MFj1WlBvm196eoUQy9-4o0g6yMPdHivixZPyC5_SrL33goM-JmInMv7a8SswVTQXNM-sqVe5TzEqU5dsRLjLa3aFQ99WwodMluHHULK0m2ihB2yX6pQl41eiF_ySzdI99QL9cky52tWU8uHUD6VgFQ=w1280" class="watermark-logo" alt="">
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",
        databaseURL: "https://san7-brasil-default-rtdb.firebaseio.com",
        projectId: "san7-brasil",
        authDomain: "san7-brasil.firebaseapp.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentDisplayedOrder = null;

    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast-msg';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }

    function formatDate(timestamp) {
        if (!timestamp) return 'Não registrado';
        return new Date(timestamp).toLocaleString('pt-BR');
    }

    function formatDateOnly(timestamp) {
        if (!timestamp) return '---';
        return new Date(timestamp).toLocaleDateString('pt-BR');
    }

    function getStatusColor(status) {
        const map = {
            'Pendente': '#E67E22',
            'Aguardando aprovação': '#F39C12',
            'Aguardando pagamento': '#3498DB',
            'Em andamento': '#2ECC71',
            'Concluído': '#27AE60',
            'Cancelado': '#E74C3C'
        };
        return map[status] || '#7F8C8D';
    }

    function maskPhoneMiddle(number) {
        if (!number) return '---';
        let cleaned = number.toString().replace(/\D/g, '');
        if (cleaned.length <= 4) return cleaned;
        return cleaned.slice(0, 2) + '****' + cleaned.slice(-4);
    }

    function showFullImage(url) {
        let div = document.createElement('div');
        div.className = 'image-overlay';
        div.innerHTML = `<img src="${url}" class="full-image" draggable="false"><span class="close-overlay material-symbols-outlined">close</span>`;
        document.body.appendChild(div);
        div.querySelector('.close-overlay').addEventListener('click', () => div.remove());
        div.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
        div.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });
    }

    function renderComprovante(order) {
        const statusColor = getStatusColor(order.status);
        const fotos = (order.images || []).map(img => `<img src="${img}" class="photo-item" data-img="${img}" draggable="false">`).join('');
        const valorTotal = (order.priceFinal || 0).toFixed(2);
        
        let html = `
            <div class="comprovante-card" id="comprovantePrintArea">
                <div class="comprovante-header">
                    <span class="comprovante-num">${escapeHtml(order.orderNumber || order.id.slice(-6))}</span>
                    <span class="status-badge" style="border-left-color: ${statusColor}; color: ${statusColor};">${order.status || 'Pendente'}</span>
                </div>
                <div class="info-linha">
                    <span class="info-label">Cliente</span>
                    <span class="info-value">${escapeHtml(order.customer || '---')}</span>
                </div>
                <div class="info-linha">
                    <span class="info-label">Telefone</span>
                    <span class="info-value">${maskPhoneMiddle(order.telefone)}</span>
                </div>
                <div class="info-linha">
                    <span class="info-label">Drone</span>
                    <span class="info-value">${escapeHtml(order.productName || '---')}</span>
                </div>
                <div class="info-linha">
                    <span class="info-label">Marca / Série</span>
                    <span class="info-value">${escapeHtml(order.brand || '---')} ${order.serial ? '/'+escapeHtml(order.serial) : ''}</span>
                </div>
                <div class="info-linha">
                    <span class="info-label">Data de entrada</span>
                    <span class="info-value">${formatDateOnly(order.arrivalDate || order.createdAt)}</span>
                </div>
                ${order.departureDate ? `<div class="info-linha"><span class="info-label">Data de saída</span><span class="info-value">${formatDateOnly(order.departureDate)}</span></div>` : ''}
                <div class="info-linha">
                    <span class="info-label">Valor total</span>
                    <span class="info-value">R$ ${valorTotal}</span>
                </div>
                ${order.metodoPagamento ? `<div class="info-linha"><span class="info-label">Pagamento</span><span class="info-value">${escapeHtml(order.metodoPagamento)}</span></div>` : ''}
                ${order.defeito ? `<div class="info-linha"><span class="info-label">Defeito</span><span class="info-value">${escapeHtml(order.defeito)}</span></div>` : ''}
                ${order.solucoes ? `<div class="info-linha"><span class="info-label">Solução</span><span class="info-value">${escapeHtml(order.solucoes)}</span></div>` : ''}
            </div>
        `;
        
        if (fotos) {
            html += `<div class="comprovante-card" style="margin-top: 16px;"><div class="fotos-bloco"><div class="fotos-titulo">Registros fotográficos</div><div class="photo-grid">${fotos}</div></div></div>`;
        }
        
        html += `<button id="downloadComprovanteBtn" class="btn-download-comprovante"><span class="material-symbols-outlined">download</span> Baixar comprovante (imagem)</button>`;
        
        document.getElementById('resultArea').innerHTML = html;
        
        document.querySelectorAll('.photo-item').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                showFullImage(el.dataset.img);
            });
            el.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
            el.addEventListener('dragstart', (e) => { e.preventDefault(); return false; });
        });
        
        document.getElementById('downloadComprovanteBtn')?.addEventListener('click', async () => {
            const elemento = document.getElementById('comprovantePrintArea');
            if (!elemento) return;
            const originalBg = elemento.style.backgroundColor;
            elemento.style.backgroundColor = '#ffffff';
            try {
                const canvas = await html2canvas(elemento, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
                const link = document.createElement('a');
                link.download = `comprovante_${order.orderNumber || order.id.slice(-6)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('Comprovante baixado');
            } catch(err) {
                showToast('Erro ao gerar imagem');
            } finally {
                elemento.style.backgroundColor = originalBg;
            }
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function buscarPorTelefone(telefone) {
        let telefoneLimpo = telefone.toString().replace(/\D/g, '');
        if (telefoneLimpo.length < 8) {
            showToast('Digite um telefone válido');
            return null;
        }
        
        const searchCard = document.getElementById('searchCard');
        const loadingDiv = document.getElementById('loadingArea');
        const resultDiv = document.getElementById('resultArea');
        
        searchCard.style.display = 'none';
        loadingDiv.style.display = 'flex';
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        
        const snap = await db.ref('ordens').once('value');
        const ordens = snap.val();
        
        loadingDiv.style.display = 'none';
        
        if (!ordens) {
            searchCard.style.display = 'block';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error-msg">Nenhuma ordem encontrada.</div>';
            return null;
        }
        
        let foundOrder = null;
        for (let id in ordens) {
            const ordem = ordens[id];
            const telefoneOrdem = (ordem.telefone || '').replace(/\D/g, '');
            if (telefoneOrdem === telefoneLimpo) {
                foundOrder = { id, ...ordem };
                break;
            }
        }
        
        if (foundOrder) {
            resultDiv.style.display = 'block';
            currentDisplayedOrder = foundOrder;
            renderComprovante(foundOrder);
        } else {
            searchCard.style.display = 'block';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error-msg">Nenhuma ordem encontrada para este telefone.</div>';
        }
        return foundOrder;
    }

    document.getElementById('buscarBtn').addEventListener('click', async () => {
        const telefone = document.getElementById('phoneInput').value.trim();
        if (!telefone) {
            showToast('Informe o telefone para consulta');
            return;
        }
        await buscarPorTelefone(telefone);
    });

    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('buscarBtn').click();
        }
    });

    document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
        }
    });
    document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
