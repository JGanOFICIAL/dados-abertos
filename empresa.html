<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo - SAN7DOC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --azul:#0b1e3f; --azul-claro:#16305a; --branco:#ffffff;
  --cinza:#f5f6f8; --borda:#e1e4e8; --texto:#1a1d21; --suave:#6b7280;
  --rosa:#f7a8b8; --verde:#0b8f3a; --dourado:#d4af37;
  --sombra:0 1px 3px rgba(0,0,0,.06); --sombra-f:0 10px 30px rgba(0,0,0,.12);
  --t:all .2s ease;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--branco);color:var(--texto);font-size:14px;}

#lock-screen{position:fixed;inset:0;background:var(--azul);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;transition:var(--t);}
#lock-screen.hidden{opacity:0;pointer-events:none;}
.lock-box{background:var(--branco);padding:40px 32px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;}
.lock-icon{width:56px;height:56px;background:var(--azul);color:var(--branco);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:20px;}
.lock-title{font-size:16px;font-weight:700;color:var(--azul);margin-bottom:6px;letter-spacing:.5px;}
.lock-subtitle{font-size:12px;color:var(--suave);margin-bottom:24px;text-align:center;}
.pin-input{width:100%;padding:14px;font-size:18px;font-weight:600;letter-spacing:8px;text-align:center;background:var(--cinza);border:none;outline:none;color:var(--azul);font-family:'Inter',sans-serif;transition:var(--t);}
.pin-input:focus{background:var(--branco);box-shadow:0 0 0 2px var(--azul);}
.pin-error{color:var(--rosa);font-size:12px;margin-top:10px;height:16px;text-align:center;}
.lock-btn{width:100%;padding:14px;background:var(--azul);color:var(--branco);border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;font-family:'Inter',sans-serif;transition:var(--t);}
.lock-btn:hover{background:var(--azul-claro);}

#app{display:flex;height:100vh;width:100vw;opacity:0;transition:var(--t);}
#app.visible{opacity:1;}

.sidebar{width:230px;background:var(--azul);display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:var(--t);}
.sidebar-brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand h1{font-size:14px;font-weight:700;color:var(--branco);letter-spacing:1px;}
.sidebar-brand span{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.5px;}
.sidebar-nav{flex:1;display:flex;flex-direction:column;padding:12px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.7);cursor:pointer;transition:var(--t);border-left:3px solid transparent;}
.nav-item:hover{background:var(--azul-claro);color:var(--branco);}
.nav-item.active{background:var(--azul-claro);color:var(--branco);border-left-color:var(--dourado);}
.nav-item i{width:18px;text-align:center;font-size:14px;}
.nav-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;padding:14px 20px 6px;text-transform:uppercase;}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:rgba(255,255,255,.4);text-align:center;}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--branco);}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--borda);background:var(--branco);gap:12px;flex-shrink:0;}
.header h2{font-size:16px;font-weight:700;color:var(--azul);letter-spacing:.3px;}
.header-actions{display:flex;gap:6px;align-items:center;}
.header-btn{width:38px;height:38px;background:var(--cinza);border:none;color:var(--azul);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t);font-size:14px;}
.header-btn:hover{background:var(--azul);color:var(--branco);}
.content-area{flex:1;overflow-y:auto;padding:20px;}

.btn{padding:10px 16px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:var(--t);display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--azul);color:var(--branco);}
.btn-primary:hover{background:var(--azul-claro);}
.btn-secondary{background:var(--cinza);color:var(--suave);}
.btn-secondary:hover{background:var(--borda);}
.btn-danger{background:var(--rosa);color:var(--branco);}
.btn-danger:hover{background:#e58a9a;}
.btn-success{background:var(--verde);color:var(--branco);}
.btn-success:hover{background:#0a7a32;}
.btn-sm{padding:7px 12px;font-size:11px;}
.btn-block{width:100%;justify-content:center;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--branco);padding:18px;border:1px solid var(--borda);}
.stat-card .label{font-size:10px;color:var(--suave);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:8px;}
.stat-card .value{font-size:22px;font-weight:700;color:var(--azul);}
.stat-card .sub{font-size:11px;color:var(--suave);margin-top:4px;}

.table-container{background:var(--branco);border:1px solid var(--borda);}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--borda);gap:12px;flex-wrap:wrap;}
.table-header h3{font-size:14px;font-weight:700;color:var(--azul);}
.table-search{position:relative;flex:1;max-width:280px;}
.table-search input{width:100%;padding:9px 12px 9px 34px;background:var(--cinza);border:none;font-size:12px;font-family:'Inter',sans-serif;outline:none;}
.table-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--suave);font-size:12px;}
.table-wrap{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:600px;}
th{text-align:left;padding:12px 16px;font-size:10px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.7px;background:var(--cinza);border-bottom:1px solid var(--borda);}
td{padding:12px 16px;font-size:12px;border-bottom:1px solid var(--borda);}
tr:hover td{background:var(--cinza);}
.badge{display:inline-block;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.badge-success{background:#e6f6ec;color:var(--verde);}
.badge-warning{background:#fdf0f2;color:var(--rosa);}
.badge-danger{background:#ffe0e0;color:#c0392b;}
.badge-neutral{background:var(--cinza);color:var(--suave);}
.badge-dourado{background:#fdf6e3;color:#a08320;}
.badge-code{font-family:monospace;font-size:11px;}
.actions-cell{display:flex;gap:6px;justify-content:flex-end;}
.action-btn{width:32px;height:32px;background:var(--cinza);border:none;color:var(--azul);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t);font-size:12px;}
.action-btn:hover{background:var(--azul);color:var(--branco);}
.action-btn.danger:hover{background:var(--rosa);color:var(--branco);}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:300;padding:16px;background:rgba(0,0,0,.4);}
.modal.active{display:flex;}
.modal-content{background:var(--branco);padding:24px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:var(--sombra-f);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--borda);}
.modal-header h3{font-size:15px;font-weight:700;color:var(--azul);letter-spacing:.3px;}
.close-btn{width:32px;height:32px;background:var(--cinza);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--suave);transition:var(--t);font-size:13px;}
.close-btn:hover{background:var(--rosa);color:var(--branco);}

.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 12px;background:var(--cinza);border:none;font-size:13px;font-family:'Inter',sans-serif;outline:none;color:var(--texto);transition:var(--t);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{background:var(--branco);box-shadow:0 0 0 2px var(--azul);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.form-hint{font-size:11px;color:var(--suave);margin-top:4px;line-height:1.5;}
.form-section{padding:14px;background:var(--cinza);margin-bottom:14px;}
.form-section-title{font-size:11px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--borda);}

.image-upload{border:2px dashed var(--borda);padding:20px;text-align:center;cursor:pointer;transition:var(--t);background:var(--branco);}
.image-upload:hover{border-color:var(--azul);}
.image-upload i{font-size:24px;color:var(--suave);margin-bottom:8px;display:block;}
.image-upload p{font-size:12px;color:var(--suave);}
.image-preview{width:100%;height:140px;background-size:cover;background-position:center;background-color:var(--cinza);margin-top:10px;display:none;border:1px solid var(--borda);}
.image-preview.show{display:block;}

.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--branco);border:1px solid var(--borda);margin-bottom:8px;}
.switch-row .txt{flex:1;}
.switch-row .txt .t{font-size:13px;font-weight:600;}
.switch-row .txt .d{font-size:11px;color:var(--suave);margin-top:2px;}
.switch{position:relative;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.2s;}
.switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;transition:.2s;}
.switch input:checked + .slider{background:var(--verde);}
.switch input:checked + .slider:before{transform:translateX(20px);}

.label-preview-box{
  background:var(--cinza);padding:16px;display:flex;align-items:center;justify-content:center;
  min-height:180px;margin-bottom:14px;
}
.label-preview{
  background:var(--branco);border:1px dashed var(--borda);padding:6px;
  display:flex;flex-direction:column;justify-content:space-between;
  text-align:center;font-family:'Inter',sans-serif;gap:2px;
}
.label-preview .lp-brand{font-size:7px;color:#666;text-transform:uppercase;letter-spacing:.3px;}
.label-preview .lp-name{font-size:10px;font-weight:700;line-height:1.1;}
.label-preview .lp-id{font-size:7px;font-family:monospace;color:#666;}
.label-preview .lp-barcode{
  font-family:'Libre Barcode 39',monospace;font-size:20px;line-height:1;letter-spacing:1px;
}
.label-preview .lp-price{font-size:12px;font-weight:700;}
.label-preview .lp-price.cash{color:var(--azul);}
.label-preview .lp-price.card{color:var(--rosa);font-size:10px;}

#notification-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10000;pointer-events:none;}
.notification{background:var(--branco);padding:16px 22px;box-shadow:var(--sombra-f);border-left:4px solid var(--azul);display:flex;align-items:center;gap:12px;min-width:260px;max-width:400px;transform:scale(.9) translateY(10px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:all;}
.notification.show{transform:scale(1) translateY(0);opacity:1;}
.notification.success{border-left-color:var(--verde);}
.notification.error{border-left-color:var(--rosa);}
.notification-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notification.success .notification-icon{background:#e6f6ec;color:var(--verde);}
.notification.error .notification-icon{background:#fdeef1;color:var(--rosa);}
.notification.info .notification-icon{background:var(--cinza);color:var(--azul);}
.notification-text{display:flex;flex-direction:column;gap:2px;}
.notification-text .title{font-size:13px;font-weight:700;}
.notification-text .message{font-size:11px;color:var(--suave);}

.menu-toggle{display:none;width:38px;height:38px;background:var(--cinza);border:none;color:var(--azul);cursor:pointer;align-items:center;justify-content:center;font-size:15px;}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:var(--t);}
.sidebar-overlay.active{opacity:1;pointer-events:all;}

@media (max-width:768px){
  .sidebar{position:fixed;left:-100%;top:0;bottom:0;width:240px;box-shadow:var(--sombra-f);}
  .sidebar.open{left:0;}
  .menu-toggle{display:flex;}
  .form-row,.form-row-3{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .header{padding:10px 14px;}
  .content-area{padding:14px;}
  .modal-content{padding:18px;}
}
@media (max-width:520px){
  .stats-grid{grid-template-columns:1fr;}
  .table-header{flex-direction:column;align-items:stretch;}
  .table-search{max-width:100%;}
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon"><i class="fas fa-shield-alt"></i></div>
    <div class="lock-title">PAINEL ADMINISTRATIVO</div>
    <div class="lock-subtitle">Digite o código do administrador</div>
    <input type="password" class="pin-input" id="pinInput" maxlength="8" inputmode="numeric" autocomplete="off">
    <div class="pin-error" id="pinError"></div>
    <button class="lock-btn" onclick="unlock()">ENTRAR</button>
  </div>
</div>

<div id="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1 id="brandName">SAN7DOC</h1>
      <span>PAINEL ADMINISTRATIVO</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
        <i class="fas fa-chart-pie"></i><span>Dashboard</span>
      </div>
      <div class="nav-item" data-page="produtos" onclick="showPage('produtos')">
        <i class="fas fa-box"></i><span>Produtos</span>
      </div>
      <div class="nav-item" data-page="estoque" onclick="showPage('estoque')">
        <i class="fas fa-warehouse"></i><span>Estoque</span>
      </div>
      <div class="nav-item" data-page="vendas" onclick="showPage('vendas')">
        <i class="fas fa-receipt"></i><span>Vendas</span>
      </div>
      <div class="nav-item" data-page="historico" onclick="showPage('historico')">
        <i class="fas fa-history"></i><span>Histórico</span>
      </div>
      <div class="nav-item" data-page="etiquetas" onclick="showPage('etiquetas')">
        <i class="fas fa-tags"></i><span>Etiquetas</span>
      </div>
      <div class="nav-section">Configurações</div>
      <div class="nav-item" data-page="config" onclick="showPage('config')">
        <i class="fas fa-cog"></i><span>Geral</span>
      </div>
      <div class="nav-item" data-page="acessos" onclick="showPage('acessos')">
        <i class="fas fa-key"></i><span>Acessos</span>
      </div>
      <div class="nav-item" data-page="lojas" onclick="showPage('lojas')">
        <i class="fas fa-store"></i><span>Lojas</span>
      </div>
      <div class="nav-item" data-page="comprovante" onclick="showPage('comprovante')">
        <i class="fas fa-file-invoice"></i><span>Comprovante</span>
      </div>
      <div class="nav-item" onclick="lockAdmin()">
        <i class="fas fa-sign-out-alt"></i><span>Sair</span>
      </div>
    </nav>
    <div class="sidebar-footer">SAN7DOC TECNOLOGIA</div>
  </aside>

  <main class="main-content">
    <header class="header">
      <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <h2 id="pageTitle">DASHBOARD</h2>
      <div class="header-actions">
        <button class="header-btn" onclick="lockAdmin()" title="Bloquear"><i class="fas fa-lock"></i></button>
      </div>
    </header>
    <div class="content-area" id="pageContent"></div>
  </main>
</div>

<div class="modal" id="genericModal">
  <div class="modal-content" id="modalContent"></div>
</div>

<div id="notification-container"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
(function(){
'use strict';

var firebaseConfig = {
  apiKey: "AIzaSyCVdKIP6jl-mLaqHNMW-IwK3pVkvhuSvSI",
  databaseURL: "https://san7-brasil-default-rtdb.firebaseio.com",
  projectId: "san7-brasil",
  authDomain: "san7-brasil.firebaseapp.com"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var state = {
  products: [],
  sales: [],
  stockHistory: [],
  currentPage: 'dashboard',
  config: {
    adminCode: '1234',
    adminCodeLoja2: '5678',
    sellerCode: '2026',
    companyName: 'SAN7DOC',
    storeNames: { loja1:'Loja 1', loja2:'Loja 2' },
    receiptModel: 'simples',
    linkedStores: false,
    allowSellerFinishDay: false,
    labelConfig: defaultLabelConfig()
  },
  uploadImageData: null
};

function defaultLabelConfig(){
  return {
    showCompany: true,
    showName: true,
    showId: true,
    showBarcode: true,
    showPriceCash: true,
    showPriceCard: false,
    size: 'medium'
  };
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function(){
  loadConfig();
  loadProducts();
  loadSales();
  loadStockHistory();
  setupPinInput();
});

function setupPinInput(){
  var el = document.getElementById('pinInput');
  el.addEventListener('keydown', function(e){ if (e.key==='Enter') unlock(); });
  el.addEventListener('input', function(){ document.getElementById('pinError').textContent=''; });
}

function loadConfig(){
  db.ref('config').on('value', function(snap){
    var d = snap.val() || {};
    state.config = Object.assign({}, state.config, d);
    if (!state.config.labelConfig) state.config.labelConfig = defaultLabelConfig();
    if (d.companyName) document.getElementById('brandName').textContent = d.companyName.toUpperCase();
  });
}

function unlock(){
  var v = document.getElementById('pinInput').value.trim();
  if (!v){ document.getElementById('pinError').textContent='Digite o código'; return; }
  var valid = [state.config.adminCode, state.config.adminCodeLoja2].filter(function(x){ return x; });
  if (valid.indexOf(v) !== -1){
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('app').classList.add('visible');
    notify('success','Acesso Autorizado','Bem-vindo, proprietário');
  } else {
    document.getElementById('pinError').textContent='Código incorreto';
    document.getElementById('pinInput').value='';
  }
}

function lockAdmin(){
  document.getElementById('lock-screen').classList.remove('hidden');
  document.getElementById('app').classList.remove('visible');
  document.getElementById('pinInput').value='';
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}

function showPage(page){
  state.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(function(i){
    i.classList.toggle('active', i.dataset.page === page);
  });
  var titles = {
    dashboard:'DASHBOARD', produtos:'PRODUTOS', estoque:'ESTOQUE',
    vendas:'VENDAS', historico:'HISTÓRICO', etiquetas:'ETIQUETAS',
    config:'CONFIGURAÇÕES GERAIS', acessos:'ACESSOS', lojas:'LOJAS',
    comprovante:'MODELO DE COMPROVANTE'
  };
  document.getElementById('pageTitle').textContent = titles[page] || 'DASHBOARD';
  var c = document.getElementById('pageContent');
  switch(page){
    case 'dashboard': renderDashboard(c); break;
    case 'produtos': renderProdutos(c); break;
    case 'estoque': renderEstoque(c); break;
    case 'vendas': renderVendas(c); break;
    case 'historico': renderHistorico(c); break;
    case 'etiquetas': renderEtiquetas(c); break;
    case 'config': renderConfig(c); break;
    case 'acessos': renderAcessos(c); break;
    case 'lojas': renderLojas(c); break;
    case 'comprovante': renderComprovante(c); break;
  }
  if (window.innerWidth <= 768) toggleSidebar();
}

// ===== DASHBOARD =====
function renderDashboard(container){
  var today = new Date().toISOString().split('T')[0];
  var todaySales = state.sales.filter(function(s){ return s.date===today && s.status!=='canceled'; });
  var totalToday = todaySales.reduce(function(s,x){ return s+(x.total||0); },0);
  var lowStock = state.products.filter(function(p){ return (p.stock||0) < 10; }).length;
  var avista = todaySales.filter(function(s){ return s.paymentMethod==='avista'; }).reduce(function(s,x){ return s+x.total; },0);
  var credito = todaySales.filter(function(s){ return s.paymentMethod==='credito'; }).reduce(function(s,x){ return s+x.total; },0);

function handleImageUpload(e){
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 500*1024){
    notify('error','Imagem grande','Use imagens menores que 500KB');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev){
    state.uploadImageData = ev.target.result;
    var preview = document.getElementById('imagePreview');
    preview.style.backgroundImage = 'url(\'' + ev.target.result + '\')';
    preview.classList.add('show');
  };
  reader.readAsDataURL(file);
}

function saveProduct(id){
  var name = document.getElementById('prodName').value.trim();
  if (!name) return notify('error','Atenção','Nome é obrigatório');

  var data = {
    name: name,
    priceCash: parseFloat(document.getElementById('prodPriceCash').value) || 0,
    priceCard: parseFloat(document.getElementById('prodPriceCard').value) || 0,
    stock: parseInt(document.getElementById('prodStock').value) || 0,
    barcode: document.getElementById('prodBarcode').value.trim(),
    store: document.getElementById('prodStore').value,
    updatedAt: new Date().toISOString()
  };
  if (state.uploadImageData) data.image = state.uploadImageData;

  if (id){
    db.ref('products/' + id).update(data).then(function(){
      notify('success','Produto Atualizado', name);
      closeModal();
    }).catch(function(e){ notify('error','Erro', e.message); });
  } else {
    var ref = db.ref('products').push();
    data.id = ref.key;
    data.createdAt = new Date().toISOString();
    data.active = true;
    ref.set(data).then(function(){
      notify('success','Produto Cadastrado', name);
      closeModal();
    }).catch(function(e){ notify('error','Erro', e.message); });
  }
}

      (s.status!=='canceled' ? '<button class="btn btn-danger" style="flex:1;justify-content:center;" onclick="App.cancelSale(\'' + s.id + '\')"><i class="fas fa-ban"></i> Cancelar Venda</button>' : '') +

function cancelSale(id){
  if (!confirm('Cancelar esta venda e restaurar o estoque?')) return;
  var s = state.sales.find(function(x){ return x.id===id; });
  if (!s) return;

  var promises = (s.items||[]).map(function(i){
    var p = state.products.find(function(x){ return x.id===i.id; });
    if (p) return db.ref('products/' + i.id).update({ stock: (p.stock||0) + i.qty });
    return Promise.resolve();
  });

  Promise.all(promises).then(function(){
    return db.ref('sales/' + id).update({ status:'canceled', canceledAt:new Date().toISOString() });
  }).then(function(){
    notify('success','Venda Cancelada','Estoque restaurado');
    closeModal();
  }).catch(function(e){ notify('error','Erro', e.message); });
}

function renderHistRows(sales){
  if (sales.length === 0) return '<tr><td colspan="8" style="text-align:center;color:var(--suave);padding:40px;">Nenhum registro</td></tr>';
  return sales.map(function(s){
    return '<tr>' +
      '<td style="font-family:monospace;font-size:11px;">' + s.id + '</td>' +
      '<td>' + s.date + '</td><td>' + s.time + '</td>' +
      '<td><span class="badge badge-neutral">' + storeLabel(s.store) + '</span></td>' +
      '<td><strong>' + fmt(s.total) + '</strong></td>' +
      '<td>' + labelPayment(s.paymentMethod) + '</td>' +
      '<td><span class="badge ' + (s.status==='canceled'?'badge-danger':'badge-success') + '">' + (s.status==='canceled'?'Cancelada':'Concluída') + '</span></td>' +
      '<td style="text-align:right;"><div class="actions-cell" style="justify-content:flex-end;">' +
        '<button class="action-btn" onclick="App.viewSale(\'' + s.id + '\')" title="Ver"><i class="fas fa-eye"></i></button>' +
        (s.status!=='canceled' ? '<button class="action-btn danger" onclick="App.cancelSale(\'' + s.id + '\')" title="Cancelar"><i class="fas fa-ban"></i></button>' : '') +
      '</div></td></tr>';
  }).join('');
}

function filterHistorico(){
  var v = document.getElementById('histSearchInput').value;
  var d = document.getElementById('histDateInput').value;
  var all = state.sales.slice().sort(function(a,b){ return b.timestamp - a.timestamp; });
  var f = all.filter(function(s){
    var matchText = !v || s.id.toLowerCase().indexOf(v.toLowerCase()) !== -1 || s.date.indexOf(v) !== -1;
    var matchDate = !d || s.date === d;
    return matchText && matchDate;
  });
  document.getElementById('histTableBody').innerHTML = renderHistRows(f);
}

function doPrintEtiq(){
  var inputs = document.querySelectorAll('[data-etiq-id]');
  var selected = [];
  inputs.forEach(function(i){
    var qty = parseInt(i.value) || 0;
    if (qty > 0){
      var p = state.products.find(function(x){ return x.id===i.dataset.etiqId; });
      if (p) selected.push({ product:p, qty:qty });
    }
  });
  if (selected.length === 0) return notify('error','Atenção','Selecione ao menos um produto');

  var lc = state.config.labelConfig || defaultLabelConfig();
  var dims = { small:['30mm','20mm'], medium:['50mm','30mm'], large:['60mm','40mm'] }[lc.size];

  var html = '<html><head><title>Etiquetas</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">' +
    '<style>' +
    '@page{margin:2mm;} body{font-family:Arial,Inter,sans-serif;margin:0;padding:0;}' +
    '.label{width:' + dims[0] + ';height:' + dims[1] + ';display:inline-flex;flex-direction:column;justify-content:space-between;padding:2mm;box-sizing:border-box;page-break-inside:avoid;margin:1mm;border:1px dashed #ccc;vertical-align:top;text-align:center;}' +
    '.lp-brand{font-size:7px;color:#666;text-transform:uppercase;letter-spacing:.3px;}' +
    '.lp-name{font-size:10px;font-weight:700;line-height:1.1;overflow:hidden;}' +
    '.lp-id{font-size:7px;font-family:monospace;color:#666;}' +
    '.lp-barcode{font-family:"Libre Barcode 39",monospace;font-size:20px;line-height:1;letter-spacing:1px;}' +
    '.lp-price{font-size:12px;font-weight:700;}' +
    '.lp-price.card{font-size:10px;color:#c46;}' +
    '</style></head><body>';

  selected.forEach(function(s){
    for (var i=0;i<s.qty;i++){
      html += '<div class="label">';
      if (lc.showCompany) html += '<div class="lp-brand">' + (state.config.companyName||'SAN7DOC') + '</div>';
      if (lc.showName) html += '<div class="lp-name">' + (s.product.name||'').substring(0,40) + '</div>';
      if (lc.showBarcode) html += '<div class="lp-barcode">*' + (s.product.barcode||s.product.id) + '*</div>';
      if (lc.showId) html += '<div class="lp-id">' + s.product.id + '</div>';
      if (lc.showPriceCash) html += '<div class="lp-price">' + fmt(s.product.priceCash||0) + '</div>';
      if (lc.showPriceCard) html += '<div class="lp-price card">Cartão: ' + fmt(s.product.priceCard||0) + '</div>';
      html += '</div>';
    }
  });
  html += '</body></html>';

  var w = window.open('','_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ w.print(); }, 500);
  notify('success','Etiquetas', selected.reduce(function(a,b){ return a+b.qty; },0) + ' etiqueta(s)');
}

}

function saveComprovante(){
  var m = document.querySelector('input[name="modelo"]:checked').value;
  db.ref('config').update({ receiptModel: m }).then(function(){
    notify('success','Modelo Salvo','');
  }).catch(function(e){ notify('error','Erro', e.message); });

// ===== FIREBASE LISTENERS =====
function loadProducts(){
  db.ref('products').on('value', function(snap){
    var d = snap.val();
    state.products = [];
    if (d) Object.keys(d).forEach(function(k){
      var obj = Object.assign({}, d[k]);
      obj.id = k;
      state.products.push(obj);
    });
    if (state.currentPage==='produtos') renderProdutos(document.getElementById('pageContent'));
    if (state.currentPage==='estoque') renderEstoque(document.getElementById('pageContent'));
    if (state.currentPage==='dashboard') renderDashboard(document.getElementById('pageContent'));
    if (state.currentPage==='etiquetas') renderEtiquetas(document.getElementById('pageContent'));
  });
}

function loadSales(){
  db.ref('sales').on('value', function(snap){
    var d = snap.val();
    state.sales = [];
    if (d) Object.keys(d).forEach(function(k){
      var obj = Object.assign({}, d[k]);
      obj.id = k;
      state.sales.push(obj);
    });
    if (state.currentPage==='dashboard') renderDashboard(document.getElementById('pageContent'));
    if (state.currentPage==='vendas') renderVendas(document.getElementById('pageContent'));

}

}

// ===== HELPERS =====
function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('genericModal').classList.add('active');
}
function closeModal(){ document.getElementById('genericModal').classList.remove('active'); }
function fmt(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0); }
function labelPayment(m){
  return { avista:'À Vista (Dinheiro/Pix)', credito:'Crédito', debito:'Débito' }[m] || m;
}
function storeLabel(s){
  if (!s) return '—';
  if (s==='both') return 'Ambas';
  if (s==='loja1') return state.config.storeNames&&state.config.storeNames.loja1||'Loja 1';
  if (s==='loja2') return state.config.storeNames&&state.config.storeNames.loja2||'Loja 2';
  return s;
}
function generateBarcode(){
  // Código de barras de 8 dígitos gerado pelo sistema
  var code = '';
  for (var i=0;i<8;i++) code += Math.floor(Math.random()*10).toString();
  return code;
}
function notify(type,title,message){
  var c = document.getElementById('notification-container');
  var ic = { success:'fa-check',error:'fa-exclamation',info:'fa-info' };
  var el = document.createElement('div');
  el.className = 'notification ' + type;
  el.innerHTML = '<div class="notification-icon"><i class="fas ' + (ic[type]||ic.info) + '"></i></div>' +
    '<div class="notification-text"><div class="title">' + title + '</div>' +
    '<div class="message">' + (message||'') + '</div></div>';
  c.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); },300); }, 1800);
}
